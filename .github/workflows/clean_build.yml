name: Build clean kernel

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Kernel source branch/ref to build (e.g. hyper-17, or "bisect")'
        required: true
        default: 'hyper-17'
      enable_bpf:
        description: 'Apply the 5.10 BPF backport (whole-feature toggle)'
        required: true
        type: boolean
        default: false
      device_name:
        description: 'Select the target device'
        required: true
        default: 'star'
        type: choice
        options:
          - star
          - mars
          - venus
      localversion:
        description: 'Custom text to append to kernel version (uname)'
        required: true
        default: '-palaziks'
        type: string
      swap_size:
        description: 'Swap file size in GB'
        required: true
        default: '16'
        type: string
      disable_rear_screen:
        description: 'Disable rear display (star / Mi 11 Ultra only)'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || 'hyper-17' }}

      - name: Fetch BPF backport patch (build branch)
        if: ${{ inputs.enable_bpf }}
        uses: actions/checkout@v4
        with:
          ref: build
          path: .bpf-patch
          sparse-checkout: patches
          sparse-checkout-cone-mode: false

      - name: Apply BPF backport
        if: ${{ inputs.enable_bpf }}
        run: |
          set -e
          shopt -s nullglob
          patches=(.bpf-patch/patches/bpf/*.patch)
          if [ ${#patches[@]} -eq 0 ]; then echo "No BPF patches found"; exit 1; fi
          for p in "${patches[@]}"; do
            echo "Applying $(basename "$p")"
            git apply --whitespace=nowarn "$p"
          done
          echo "BPF backport applied (${#patches[@]} patches, enable_bpf=true)"

      - name: Dynamic Memory Allocation (Swap)
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: ${{ inputs.swap_size || '16' }}

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y clang lld llvm git make gcc flex bison bc \
            libssl-dev ccache libncurses5-dev libncursesw5-dev cmake \
            python3 python-is-python3 cpio

      # ── ccache ──────────────────────────────────────────────────────────────
      # build.sh hardcodes CC=clang inside make invocation, so we intercept it
      # via a wrapper binary that prepends ccache. PATH is set via GITHUB_PATH
      # so the wrapper is found before the real clang.
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: 3G
          key: kernel-${{ inputs.device_name || 'star' }}-clean

      - name: Create clang ccache wrappers
        run: |
          mkdir -p "$HOME/.ccache_wrappers"
          printf '#!/bin/sh\nexec ccache /usr/bin/clang "$@"\n' \
            > "$HOME/.ccache_wrappers/clang"
          printf '#!/bin/sh\nexec ccache /usr/bin/clang++ "$@"\n' \
            > "$HOME/.ccache_wrappers/clang++"
          chmod +x "$HOME/.ccache_wrappers/clang" \
                   "$HOME/.ccache_wrappers/clang++"
          # Prepend to PATH for all subsequent steps
          echo "$HOME/.ccache_wrappers" >> "$GITHUB_PATH"
          echo "Wrappers created:"
          ls -la "$HOME/.ccache_wrappers/"

      # ── Rear screen: disable via DTS ─────────────────────────────────────────
      # From star-sm8350.dtsi:
      #   &sde_dsi1  { ... }          — secondary DSI controller (rear panel)
      #   &mdss_mdp  { connectors = <... &sde_dsi1 ...>; }
      #   &dsi_panel_pwr_supply_sec_k1 { ... }
      #   display_sec_vddi / display_sec_cvo — regulators for rear panel
      #
      # Strategy: inject "status = disabled" into sde_dsi1 override block and
      # remove &sde_dsi1 from the mdss_mdp connectors list.
      # The panel node (dsi_k1_43_06_00_sec_cmd) stays — it won't be probed
      # because its controller is disabled.
      - name: Disable Rear Screen (DTS)
        if: ${{ inputs.device_name == 'star' && inputs.disable_rear_screen == 'true' }}
        run: |
          set -e
          DTSI="arch/arm64/boot/dts/vendor/qcom/star-sm8350.dtsi"

          echo "=== Before patch (sde_dsi1 / connectors lines) ==="
          grep -n "sde_dsi1\|connectors" "$DTSI"

          python3 << 'PYEOF'
          import re

          path = "arch/arm64/boot/dts/vendor/qcom/star-sm8350.dtsi"
          with open(path, "r") as f:
              src = f.read()

          # ── 1. Inject status = "disabled" into &sde_dsi1 { } override block ──
          # Matches the first &sde_dsi1 { ... } block and appends status inside.
          def disable_sde_dsi1(text):
              pattern = r'(&sde_dsi1\s*\{)'
              def replacer(m):
                  return m.group(1) + '\n\tstatus = "disabled"; /* REAR_DISABLED */'
              # Only patch if not already disabled
              if 'REAR_DISABLED' not in text:
                  text = re.sub(pattern, replacer, text, count=1)
              return text

          # ── 2. Remove &sde_dsi1 from connectors = <...> list ─────────────────
          # connectors = <&smmu_sde_unsec &smmu_sde_sec &sde_wb &sde_dsi
          #       &sde_dsi1 &sde_rscc>;
          def remove_from_connectors(text):
              # Remove &sde_dsi1 token (with surrounding whitespace) from connectors
              text = re.sub(r'(\bconnectors\s*=\s*<[^>]*?)\s*&sde_dsi1\b', r'\1', text)
              return text

          src = disable_sde_dsi1(src)
          src = remove_from_connectors(src)

          with open(path, "w") as f:
              f.write(src)

          print("Patch applied.")
          PYEOF

          echo "=== After patch ==="
          grep -n "sde_dsi1\|connectors\|REAR_DISABLED" "$DTSI"

      - name: Build Project
        run: |
          git config --global user.email "you@example.com"
          git config --global user.name "wannq-github"

          export LOCALVERSION="${{ inputs.localversion || '-palaziks' }}"

          # Confirm ccache wrapper is active
          echo "clang -> $(which clang)"
          ccache --zero-stats > /dev/null 2>&1 || true

          chmod +x ./build.sh
          ./build.sh all ${{ inputs.device_name || 'star' }}

          echo "=== ccache stats ==="
          ccache -s | grep -E "Hits|Misses|files in cache|cache size" || true

      - name: Compress
        run: tar -czvf build.tar.gz ../out/anykernel/*.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-${{ inputs.device_name || 'star' }}
          path: build.tar.gz
