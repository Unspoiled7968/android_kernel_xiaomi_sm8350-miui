name: Build SukiSU Ultra + SuSFS (Tracepoint)

on:
  workflow_dispatch:
    inputs:
      device_name:
        description: 'Select target device'
        required: true
        default: 'star'
        type: choice
        options: [star, mars, venus]
      localversion:
        description: 'Custom version suffix'
        required: true
        default: '-palaziks'
      swap_size:
        description: 'Swap size in GB'
        required: true
        default: '16'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Dynamic Memory Allocation (Swap)
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: ${{ inputs.swap_size || '16' }}

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y clang lld llvm git make gcc flex bison bc \
            libssl-dev ccache libncurses5-dev libncursesw5-dev cmake \
            python3 python-is-python3 cpio curl patch rsync

      - name: Apply Specialized MIUI Patches (JackA1ltman)
        run: |
          set -e
          git clone --depth=1 https://github.com/JackA1ltman/NonGKI_Kernel_Patches.git -b mi_kernel ../altman_patches
          ALTMAN_DIR="$(pwd)/../altman_patches/mi11u_hyperos"

          echo "Applying HyperOS patches..."
          patch -p1 --forward --batch < "$ALTMAN_DIR/hyperos_a14_fixed.patch" || true
          patch -p1 --forward --batch < "$ALTMAN_DIR/hyper_susfs_157_fixed.patch" || true
          patch -p1 --forward --batch < "$ALTMAN_DIR/hyper_susfs_remove_all_sus_su.patch" || true

      - name: Integrate SukiSU Ultra & Fix allowlist.c
        run: |
          set -e
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main
          
          echo "=== Fix allowlist.c for Kernel 5.4 ==="
          if [ -f KernelSU/kernel/allowlist.c ]; then
            grep -q "linux/sched/task.h" KernelSU/kernel/allowlist.c || sed -i '1i #include <linux/sched/task.h>' KernelSU/kernel/allowlist.c
            grep -q "linux/sched.h" KernelSU/kernel/allowlist.c || sed -i '1i #include <linux/sched.h>' KernelSU/kernel/allowlist.c
          fi

      - name: Run Patcher & Aggressive Cleanup (ON REAL FOLDER)
        run: |
          set -e
          # Работаем с РЕАЛЬНОЙ папкой KernelSU/kernel, а не с симлинком
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux" -o patch_linux
          if [ -s patch_linux ] && ! grep -q "404" patch_linux; then
            chmod +x patch_linux
            ./patch_linux KernelSU/kernel || true
          fi

          echo "=== Removing filter_count and pkg_observer ==="
          find KernelSU/kernel -type f -name "*.c" -exec sed -i '/filter_count/d' {} +
          sed -i '/pkg_observer.o/d' KernelSU/kernel/Makefile
          find KernelSU/kernel -type f -name "*.c" -exec sed -i 's/ksu_pkg_observer_init()/0/g' {} +
          find KernelSU/kernel -type f -name "*.c" -exec sed -i 's/ksu_pkg_observer_exit()//g' {} +
          find KernelSU/kernel -type f -name "*.c" -exec sed -i 's/module_exit(ksu_kernelsu_exit);/\/\/module_exit(ksu_kernelsu_exit);/g' {} +

          echo "=== Symlink KernelSU into drivers ==="
          ln -sf "$(pwd)/KernelSU/kernel" drivers/kernelsu
          grep -q "kernelsu" drivers/Makefile || echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          grep -q "kernelsu" drivers/Kconfig || sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

      - name: Apply KSU Tracepoint Hooks
        run: |
          python3 << 'EOF'
          import sys, re, os
          def smart_patch(filepath, pattern, replacement):
              if not os.path.exists(filepath): return
              with open(filepath, 'r') as f: content = f.read()
              if 'ksu_trace' in content: return
              new_content, n = re.subn(pattern, replacement, content, count=0)
              if n > 0:
                  with open(filepath, 'w') as f: f.write(new_content)
          def add_include(filepath, include_path):
              if not os.path.exists(filepath): return
              with open(filepath, 'r') as f: content = f.read()
              if include_path in content: return
              new_content = re.sub(r'(#include <linux/.*?\.h>\n)', r'\1#if defined(CONFIG_KSU) && defined(CONFIG_KSU_TRACEPOINT_HOOK)\n#include ' + include_path + '\n#endif\n', content, count=1)
              with open(filepath, 'w') as f: f.write(new_content)

          add_include('fs/exec.c', '<../drivers/kernelsu/ksu_trace.h>')
          smart_patch('fs/exec.c', r'(return do_execveat_common\(AT_FDCWD, filename, argv, envp, 0\);)', r'#if defined(CONFIG_KSU) && defined(CONFIG_KSU_TRACEPOINT_HOOK)\n\ttrace_ksu_trace_execveat_hook((int *)AT_FDCWD, &filename, &argv, &envp, 0);\n#endif\n\t\1')
          add_include('fs/open.c', '<../drivers/kernelsu/ksu_trace.h>')
          smart_patch('fs/open.c', r'(SYSCALL_DEFINE3\(faccessat, int, dfd, const char __user \*, filename, int, mode\)\n{)', r'\1\n#if defined(CONFIG_KSU) && defined(CONFIG_KSU_TRACEPOINT_HOOK)\n\ttrace_ksu_trace_faccessat_hook(&dfd, &filename, &mode, NULL);\n#endif\n')
          add_include('fs/read_write.c', '<../drivers/kernelsu/ksu_trace.h>')
          smart_patch('fs/read_write.c', r'(SYSCALL_DEFINE3\(read, unsigned int, fd, char __user \*, buf, size_t, count\)\n{)', r'\1\n#if defined(CONFIG_KSU) && defined(CONFIG_KSU_TRACEPOINT_HOOK)\n\ttrace_ksu_trace_sys_read_hook(fd, &buf, &count);\n#endif\n')
          add_include('fs/stat.c', '<../drivers/kernelsu/ksu_trace.h>')
          smart_patch('fs/stat.c', r'(error = vfs_fstatat\(dfd, filename, &stat, flag\);)', r'#if defined(CONFIG_KSU) && defined(CONFIG_KSU_TRACEPOINT_HOOK)\n\ttrace_ksu_trace_stat_hook(&dfd, &filename, &flag);\n#endif\n\t\1')
          add_include('drivers/input/input.c', '<../../drivers/kernelsu/ksu_trace.h>')
          smart_patch('drivers/input/input.c', r'(void input_event\(struct input_dev \*dev,\n\t\t unsigned int type, unsigned int code, int value\)\n{\n\tunsigned long flags;\n)', r'\1\n#if defined(CONFIG_KSU) && defined(CONFIG_KSU_TRACEPOINT_HOOK)\n\ttrace_ksu_trace_input_hook(&type, &code, &value);\n#endif\n')
          EOF

      - name: Setup SuSFS Source Files
        run: |
          set -e
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b kernel-5.4 ../susfs4ksu
          SUSFS_DIR="$(pwd)/../susfs4ksu"
          cp -v "$SUSFS_DIR/kernel_patches/fs/susfs.c"               fs/
          cp -v "$SUSFS_DIR/kernel_patches/include/linux/susfs.h"     include/linux/
          cp -v "$SUSFS_DIR/kernel_patches/include/linux/susfs_def.h" include/linux/
          grep -q "susfs.o" fs/Makefile || echo "obj-y += susfs.o" >> fs/Makefile

      - name: Final MIUI Fixes
        run: |
          set -e
          grep -q "susfs_mnt_id_backup" include/linux/mount.h || sed -i '/int mnt_flags;/a \ \ \ \ u64 susfs_mnt_id_backup;' include/linux/mount.h
          [ -f include/linux/susfs.h ] && grep -q "^struct kstat;" include/linux/susfs.h || sed -i '1s/^/struct kstat;\n/' include/linux/susfs.h || true
          for f in fs/proc/task_mmu.c fs/proc/fd.c; do
            [ -f $f ] && (grep -q "linux/susfs.h" $f || sed -i '1i #include <linux/susfs.h>' $f)
          done
          find KernelSU/kernel -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's|#include <linux/pgtable.h>|#include <asm/pgtable.h>|g' {} + || true
          find KernelSU/kernel -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's/strncpy_from_user_nofault/strncpy_from_user/g' {} + || true
          [ -f KernelSU/kernel/allowlist.c ] && sed -i 's/TWA_RESUME/true/g' KernelSU/kernel/allowlist.c || true

      - name: Append Exact Defconfig Flags
        run: |
          set -e
          # Прописываем флаги именно в те файлы, которые использует build.sh!
          for conf in arch/arm64/configs/vendor/lahaina-qgki_defconfig arch/arm64/configs/vendor/star_QGKI.config; do
            if [ -f "$conf" ]; then
              echo "Appending to $conf..."
              for FLAG in \
                "CONFIG_KSU=y" "CONFIG_KSU_TRACEPOINT_HOOK=y" "CONFIG_KSU_DEBUG=n" \
                "CONFIG_KSU_SUSFS=y" "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" "CONFIG_KSU_SUSFS_SUS_MOUNT=y" \
                "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" "CONFIG_KSU_SUSFS_ENABLE_LOG=y" "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" \
                "CONFIG_KPM=y" "CONFIG_KALLSYMS=y" "CONFIG_KALLSYMS_ALL=y"; do
                KEY=$(echo "$FLAG" | cut -d= -f1)
                grep -q "^${KEY}[=\ ]" "$conf" || echo "$FLAG" >> "$conf"
              done
            fi
          done

      - name: Build Project
        run: |
          git config --global user.email "bot@example.com"
          git config --global user.name "wannq"
          export LOCALVERSION="${{ inputs.localversion || '-palaziks' }}"
          chmod +x ./build.sh
          ./build.sh all ${{ inputs.device_name || 'star' }} 2>&1 | tee /tmp/kbuild.log

          if [ ! -f arch/arm64/boot/Image ]; then
            echo "BUILD FAILED"
            grep -E "error:|FAILED" /tmp/kbuild.log | tail -50
            exit 1
          fi

      - name: Compress & Upload
        run: tar -czvf build.tar.gz ../out/anykernel/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Kernel-${{ inputs.device_name }}-Tracepoint-Victory
          path: build.tar.gz
