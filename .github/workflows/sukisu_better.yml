name: Build SukiSU Ultra + SuSFS (Tracepoint Hook)

on:
  workflow_dispatch:
    inputs:
      device_name:
        description: 'Select the target device'
        required: true
        default: 'star'
        type: choice
        options:
          - star
          - mars
          - venus
      localversion:
        description: 'Custom text to append to kernel version (uname)'
        required: true
        default: '-palaziks'
        type: string
      swap_size:
        description: 'Swap file size in GB'
        required: true
        default: '16'
        type: string

  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Dynamic Memory Allocation (Swap)
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: ${{ inputs.swap_size || '16' }}

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y clang lld llvm git make gcc flex bison bc \
            libssl-dev ccache libncurses5-dev libncursesw5-dev cmake \
            python3 python-is-python3 cpio curl patch

      - name: Integrate SukiSU Ultra (susfs-main)
        run: |
          set -e

          echo "=== Setting up SukiSU Ultra (susfs-main branch) ==="
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" \
            | bash -s susfs-main

          echo "=== Symlink KernelSU into drivers ==="
          ln -sf "$(pwd)/KernelSU/kernel" drivers/kernelsu

          echo "=== Wire into drivers/Makefile ==="
          grep -q "kernelsu" drivers/Makefile || \
            echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile

          echo "=== Wire into drivers/Kconfig ==="
          grep -q "kernelsu" drivers/Kconfig || \
            sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

      - name: Apply KSU Tracepoint Hooks
        run: |
          python3 << 'EOF'
          import sys

          def insert_after(filepath, search, insertion):
              try:
                  with open(filepath, 'r') as f:
                      content = f.read()
                  if 'ksu_trace' in content:
                      print(f'{filepath}: hook already present, skipping')
                      return
                  if search not in content:
                      print(f'ERROR: anchor not found in {filepath}: {repr(search)}')
                      sys.exit(1)
                  content = content.replace(search, search + insertion, 1)
                  with open(filepath, 'w') as f:
                      f.write(content)
                  print(f'{filepath}: hook applied (after)')
              except Exception as e:
                  print(f"Failed to patch {filepath}: {e}")
                  sys.exit(1)

          def insert_before(filepath, search, insertion):
              try:
                  with open(filepath, 'r') as f:
                      content = f.read()
                  if 'ksu_trace' in content:
                      return
                  if search not in content:
                      print(f'ERROR: anchor not found in {filepath}: {repr(search)}')
                      sys.exit(1)
                  content = content.replace(search, insertion + search, 1)
                  with open(filepath, 'w') as f:
                      f.write(content)
                  print(f'{filepath}: hook applied (before)')
              except Exception as e:
                  print(f"Failed to patch {filepath}: {e}")
                  sys.exit(1)

          # --- fs/exec.c ---
          insert_before('fs/exec.c', 'EXPORT_TRACEPOINT_SYMBOL_GPL(task_rename);',
              '#if defined(CONFIG_KSU) && defined(CONFIG_KSU_TRACEPOINT_HOOK)\n'
              '#include <../drivers/kernelsu/ksu_trace.h>\n'
              '#endif\n\n'
          )
          insert_before('fs/exec.c', 'return do_execveat_common(AT_FDCWD, filename, argv, envp, 0);',
              '#if defined(CONFIG_KSU) && defined(CONFIG_KSU_TRACEPOINT_HOOK)\n'
              '\ttrace_ksu_trace_execveat_hook((int *)AT_FDCWD, &filename, &argv, &envp, 0);\n'
              '#endif\n\t'
          )

          # --- fs/open.c ---
          insert_after('fs/open.c', '#include <linux/compat.h>\n',
              '#if defined(CONFIG_KSU) && defined(CONFIG_KSU_TRACEPOINT_HOOK)\n'
              '#include <../drivers/kernelsu/ksu_trace.h>\n'
              '#endif\n'
          )
          insert_after('fs/open.c', 'SYSCALL_DEFINE3(faccessat, int, dfd, const char __user *, filename, int, mode)\n{\n',
              '#if defined(CONFIG_KSU) && defined(CONFIG_KSU_TRACEPOINT_HOOK)\n'
              '\ttrace_ksu_trace_faccessat_hook(&dfd, &filename, &mode, NULL);\n'
              '#endif\n'
          )

          # --- fs/read_write.c ---
          insert_after('fs/read_write.c', '#include <asm/unistd.h>\n',
              '\n#if defined(CONFIG_KSU) && defined(CONFIG_KSU_TRACEPOINT_HOOK)\n'
              '#include <../drivers/kernelsu/ksu_trace.h>\n'
              '#endif\n\n'
          )
          # Для ядра 5.4 хукаем ksys_read
          insert_after('fs/read_write.c', 'SYSCALL_DEFINE3(read, unsigned int, fd, char __user *, buf, size_t, count)\n{\n',
              '#if defined(CONFIG_KSU) && defined(CONFIG_KSU_TRACEPOINT_HOOK)\n'
              '\ttrace_ksu_trace_sys_read_hook(fd, &buf, &count);\n'
              '#endif\n'
          )

          # --- fs/stat.c ---
          insert_after('fs/stat.c', '#include "mount.h"\n',
              '\n#if defined(CONFIG_KSU) && defined(CONFIG_KSU_TRACEPOINT_HOOK)\n'
              '#include <../drivers/kernelsu/ksu_trace.h>\n'
              '#endif\n\n'
          )
          insert_before('fs/stat.c', 'error = vfs_fstatat(dfd, filename, &stat, flag);',
              '#if defined(CONFIG_KSU) && defined(CONFIG_KSU_TRACEPOINT_HOOK)\n'
              '\ttrace_ksu_trace_stat_hook(&dfd, &filename, &flag);\n'
              '#endif\n\n\t'
          )

          # --- drivers/input/input.c ---
          insert_after('drivers/input/input.c', '#include "input-poller.h"\n',
              '\n#if defined(CONFIG_KSU) && defined(CONFIG_KSU_TRACEPOINT_HOOK)\n'
              '#include <../../drivers/kernelsu/ksu_trace.h>\n'
              '#endif\n\n'
          )
          insert_after('drivers/input/input.c', 'void input_event(struct input_dev *dev,\n\t\t unsigned int type, unsigned int code, int value)\n{\n\tunsigned long flags;\n',
              '\n#if defined(CONFIG_KSU) && defined(CONFIG_KSU_TRACEPOINT_HOOK)\n'
              '\ttrace_ksu_trace_input_hook(&type, &code, &value);\n'
              '#endif\n\n'
          )
          EOF

          echo "=== Verify Tracepoint hooks ==="
          grep -n "ksu_trace" fs/exec.c fs/open.c fs/read_write.c fs/stat.c drivers/input/input.c

      - name: Integrate SuSFS
        run: |
          set -e

          echo "=== Cloning SuSFS kernel-5.4 ==="
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b kernel-5.4 ../susfs4ksu
          SUSFS_DIR="$(pwd)/../susfs4ksu"

          echo "=== Apply SuSFS patch to kernel tree ==="
          patch -p1 < "$SUSFS_DIR/kernel_patches/50_add_susfs_in_kernel-5.4.patch" || true

          echo "=== Copy SuSFS source files ==="
          cp -v "$SUSFS_DIR/kernel_patches/fs/susfs.c"               fs/
          cp -v "$SUSFS_DIR/kernel_patches/include/linux/susfs.h"     include/linux/
          cp -v "$SUSFS_DIR/kernel_patches/include/linux/susfs_def.h" include/linux/

          echo "=== Register susfs.o in fs/Makefile ==="
          grep -q "susfs.o" fs/Makefile || echo "obj-y += susfs.o" >> fs/Makefile

      - name: Apply Manual Fixes for MIUI 5.4 QGKI
        run: |
          set -e

          echo "=== Fix 1: susfs_mnt_id_backup in mount.h ==="
          grep -q "susfs_mnt_id_backup" include/linux/mount.h || \
            sed -i '/int mnt_flags;/a \ \ \ \ u64 susfs_mnt_id_backup;' include/linux/mount.h

          echo "=== Fix 2: forward-declare struct kstat in susfs.h ==="
          [ -f include/linux/susfs.h ] && \
            grep -q "^struct kstat;" include/linux/susfs.h || \
            sed -i '1s/^/struct kstat;\n/' include/linux/susfs.h || true

          echo "=== Fix 3: add missing susfs.h includes ==="
          grep -q "linux/susfs.h" fs/proc/task_mmu.c || \
            sed -i '1s/^/#include <linux\/susfs.h>\n/' fs/proc/task_mmu.c
          grep -q "linux/susfs.h" fs/proc/fd.c || \
            sed -i '1s/^/#include <linux\/susfs.h>\n/' fs/proc/fd.c

          echo "=== Fix 4: pgtable.h compat for 5.4 ==="
          find KernelSU/kernel -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's|#include <linux/pgtable.h>|#include <asm/pgtable.h>|g' {} + || true

          echo "=== Fix 5: strncpy_from_user_nofault compat for 5.4 ==="
          find KernelSU/kernel -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's/strncpy_from_user_nofault/strncpy_from_user/g' {} + || true

          echo "=== Fix 6: Remove filter_count error (Aggressive) ==="
          find KernelSU/kernel -name "*.c" -type f -exec sed -i '/filter_count/d' {} + || true

          echo "=== Fix 7: Fix module_exit error in ksu.c ==="
          find KernelSU/kernel -name "*.c" -type f -exec sed -i 's/module_exit(ksu_kernelsu_exit);/\/\/module_exit(ksu_kernelsu_exit);/g' {} + || true
          
          echo "=== Fix 8: TWA_RESUME compat ==="
          sed -i 's/TWA_RESUME/true/g' KernelSU/kernel/allowlist.c 2>/dev/null || true
          grep -q "linux/sched/task.h" KernelSU/kernel/allowlist.c || \
            sed -i '1s/^/#include <linux\/sched\/task.h>\n/' KernelSU/kernel/allowlist.c 2>/dev/null || true

      - name: Append KSU + SuSFS flags to defconfig
        run: |
          set -e
          DEVICE="${{ inputs.device_name || 'star' }}"
          DEFCONFIG=$(find arch/arm64/configs -name "*${DEVICE}*defconfig" | head -n 1)
          if [ -z "$DEFCONFIG" ]; then
            echo "CRITICAL: defconfig not found for ${DEVICE}"
            exit 1
          fi
          echo "Using defconfig: $DEFCONFIG"

          for FLAG in \
            "CONFIG_KSU=y" \
            "CONFIG_KSU_TRACEPOINT_HOOK=y" \
            "CONFIG_KSU_DEBUG=n" \
            "CONFIG_KSU_SUSFS=y" \
            "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" \
            "CONFIG_KSU_SUSFS_SUS_MOUNT=y" \
            "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" \
            "CONFIG_KSU_SUSFS_ENABLE_LOG=y" \
            "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" \
            "CONFIG_KPM=y" \
            "CONFIG_KALLSYMS=y" \
            "CONFIG_KALLSYMS_ALL=y"; do
            KEY=$(echo "$FLAG" | cut -d= -f1)
            grep -q "^${KEY}[=\ ]" "$DEFCONFIG" || echo "$FLAG" >> "$DEFCONFIG"
          done

          echo "=== KSU flags in defconfig ==="
          grep "KSU\|KPM\|KALLSYMS" "$DEFCONFIG" || true

      - name: Build Project
        run: |
          git config --global user.email "you@example.com"
          git config --global user.name "wannq-github"

          export LOCALVERSION="${{ inputs.localversion || '-palaziks' }}"

          chmod +x ./build.sh
          ./build.sh all ${{ inputs.device_name || 'star' }} 2>&1 | tee /tmp/kbuild.log

          if [ ! -f arch/arm64/boot/Image ]; then
            echo ""
            echo "=== BUILD FAILED — last errors ==="
            grep -E "error:|undefined reference|FAILED|hunk FAILED" /tmp/kbuild.log | tail -50
            exit 1
          fi
          echo "=== Image built successfully ==="

      - name: Compress
        run: tar -czvf build.tar.gz ../out/anykernel/*.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-${{ inputs.device_name || 'star' }}-SukiSU-SuSFS
          path: build.tar.gz
