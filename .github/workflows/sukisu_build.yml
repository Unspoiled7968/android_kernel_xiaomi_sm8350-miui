name: Build SukiSU Ultra + SuSFS Kernel

on:
  workflow_dispatch:
    inputs:
      device_name:
        description: 'Select the target device'
        required: true
        default: 'star'
        type: choice
        options:
          - star
          - mars
          - venus
      localversion:
        description: 'Custom text to append to kernel version (uname)'
        required: true
        default: '-palaziks'
        type: string
      swap_size:
        description: 'Swap file size in GB'
        required: true
        default: '16'
        type: string

  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Dynamic Memory Allocation (Swap)
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: ${{ inputs.swap_size || '16' }}

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y clang lld llvm git make gcc flex bison bc \
            libssl-dev ccache libncurses5-dev libncursesw5-dev cmake \
            python3 python-is-python3 cpio curl patch

      - name: Integrate SukiSU Ultra & Cleanup
        run: |
          set -e
          echo "=== Setting up SukiSU Ultra ==="
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main

          echo "=== Symlink KernelSU into drivers ==="
          ln -sf "$(pwd)/KernelSU/kernel" drivers/kernelsu

          echo "=== Wire into drivers/Makefile ==="
          grep -q "kernelsu" drivers/Makefile || echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile

          echo "=== Wire into drivers/Kconfig ==="
          grep -q "kernelsu" drivers/Kconfig || sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

          echo "=== Aggressive Cleanup for Kernel 5.4 Compatibility ==="
          # 1. Удаляем упоминания filter_count (причина падения на 5.4)
          find drivers/kernelsu -type f -name "*.c" -exec sed -i '/filter_count/d' {} +
          
          # 2. Отключаем pkg_observer (несовместим с API fsnotify в 5.4)
          sed -i '/pkg_observer.o/d' drivers/kernelsu/Makefile
          find drivers/kernelsu -type f -name "*.c" -exec sed -i 's/ksu_pkg_observer_init()/0/g' {} +
          find drivers/kernelsu -type f -name "*.c" -exec sed -i 's/ksu_pkg_observer_exit()//g' {} +

          # 3. Фикс module_exit
          find drivers/kernelsu -type f -name "*.c" -exec sed -i 's/module_exit(ksu_kernelsu_exit);/\/\/module_exit(ksu_kernelsu_exit);/g' {} +

      - name: Apply SuSFS Integration
        run: |
          set -e
          echo "=== Cloning SuSFS kernel-5.4 ==="
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b kernel-5.4 ../susfs4ksu
          SUSFS_DIR="$(pwd)/../susfs4ksu"

          echo "=== Apply SuSFS patch to kernel tree ==="
          # Используем || true так как на MIUI 5.4 будут "hunk failed" в proc файлах (пофиксим позже)
          patch -p1 < "$SUSFS_DIR/kernel_patches/50_add_susfs_in_kernel-5.4.patch" || true

          echo "=== Copy SuSFS source files ==="
          cp -v "$SUSFS_DIR/kernel_patches/fs/susfs.c"               fs/
          cp -v "$SUSFS_DIR/kernel_patches/include/linux/susfs.h"     include/linux/
          cp -v "$SUSFS_DIR/kernel_patches/include/linux/susfs_def.h" include/linux/

          echo "=== Register susfs.o in fs/Makefile ==="
          grep -q "susfs.o" fs/Makefile || echo "obj-y += susfs.o" >> fs/Makefile

      - name: Apply Manual Fixes for MIUI 5.4 QGKI
        run: |
          set -e
          echo "=== Fix 1: susfs_mnt_id_backup in mount.h ==="
          grep -q "susfs_mnt_id_backup" include/linux/mount.h || sed -i '/int mnt_flags;/a \ \ \ \ u64 susfs_mnt_id_backup;' include/linux/mount.h

          echo "=== Fix 2: forward-declare struct kstat in susfs.h ==="
          [ -f include/linux/susfs.h ] && grep -q "^struct kstat;" include/linux/susfs.h || sed -i '1s/^/struct kstat;\n/' include/linux/susfs.h || true

          echo "=== Fix 3: add missing susfs.h includes in proc files ==="
          grep -q "linux/susfs.h" fs/proc/task_mmu.c || sed -i '1s/^/#include <linux\/susfs.h>\n/' fs/proc/task_mmu.c
          grep -q "linux/susfs.h" fs/proc/fd.c || sed -i '1s/^/#include <linux\/susfs.h>\n/' fs/proc/fd.c

          echo "=== Fix 4: pgtable.h compat for 5.4 ==="
          find drivers/kernelsu -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's|#include <linux/pgtable.h>|#include <asm/pgtable.h>|g' {} + || true

          echo "=== Fix 5: strncpy_from_user_nofault compat for 5.4 ==="
          find drivers/kernelsu -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's/strncpy_from_user_nofault/strncpy_from_user/g' {} + || true

          echo "=== Fix 6: TWA_RESUME compat in allowlist.c ==="
          [ -f drivers/kernelsu/allowlist.c ] && sed -i 's/TWA_RESUME/true/g' drivers/kernelsu/allowlist.c || true
          [ -f drivers/kernelsu/allowlist.c ] && grep -q "linux/sched/task.h" drivers/kernelsu/allowlist.c || sed -i '1s/^/#include <linux\/sched\/task.h>\n/' drivers/kernelsu/allowlist.c || true

      - name: Apply KSU Manual Hooks (Python)
        run: |
          python3 << 'EOF'
          import sys

          def insert_after(filepath, search, insertion):
              try:
                  with open(filepath, 'r') as f:
                      content = f.read()
                  if 'ksu_handle' in content:
                      print(f'{filepath}: hook already present, skipping')
                      return
                  if search not in content:
                      print(f'ERROR: anchor not found in {filepath}:', repr(search))
                      sys.exit(1)
                  content = content.replace(search, search + insertion, 1)
                  with open(filepath, 'w') as f:
                      f.write(content)
                  print(f'{filepath}: hook applied')
              except Exception as e:
                  print(f"Failed to patch {filepath}: {e}")
                  sys.exit(1)

          # fs/exec.c — hook in __do_execve_file
          insert_after('fs/exec.c', '\tchar *pathbuf = NULL;\n', 
              '#ifdef CONFIG_KSU\n\textern int ksu_handle_execveat(int *fd, struct filename **filename_ptr,\n'
              '\t\t\t\t       void *argv, void *envp, int *flags);\n\tksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);\n#endif\n')

          # fs/open.c — hook in do_faccessat
          insert_after('fs/open.c', '\tconst struct cred *old_cred;\n\tstruct cred *override_cred;\n', 
              '#ifdef CONFIG_KSU\n\textern int ksu_handle_faccessat(int *dfd, const char __user **filename_user,\n'
              '\t\t\t\t\tint *mode, int *flags);\n\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n#endif\n')

          # fs/read_write.c — hook in vfs_read
          insert_after('fs/read_write.c', 'ssize_t vfs_read(struct file *file, char __user *buf, size_t count, loff_t *pos)\n{\n\tssize_t ret;\n', 
              '#ifdef CONFIG_KSU\n\textern int ksu_handle_vfs_read(struct file **file_ptr, char __user **buf_ptr,\n'
              '\t\t\t\t       size_t *count_ptr, loff_t **pos);\n\tksu_handle_vfs_read(&file, &buf, &count, &pos);\n#endif\n')

          # fs/stat.c — hook in vfs_statx
          insert_after('fs/stat.c', '\tint error = -EINVAL;\n', 
              '#ifdef CONFIG_KSU\n\textern int ksu_handle_stat(int *dfd, const char __user **filename_user,\n'
              '\t\t\t\t   int *flags);\n\tksu_handle_stat(&dfd, &filename, &flags);\n#endif\n')
          EOF

      - name: Append KSU + SuSFS flags to defconfig
        run: |
          set -e
          DEVICE="${{ inputs.device_name || 'star' }}"
          DEFCONFIG=$(find arch/arm64/configs -name "*${DEVICE}*defconfig" | head -n 1)
          echo "Using defconfig: $DEFCONFIG"

          for FLAG in \
            "CONFIG_KSU=y" \
            "CONFIG_KSU_MANUAL_HOOK=y" \
            "CONFIG_KSU_DEBUG=n" \
            "CONFIG_KSU_SUSFS=y" \
            "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" \
            "CONFIG_KSU_SUSFS_SUS_MOUNT=y" \
            "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" \
            "CONFIG_KSU_SUSFS_ENABLE_LOG=y" \
            "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" \
            "CONFIG_KPM=y" \
            "CONFIG_KALLSYMS=y" \
            "CONFIG_KALLSYMS_ALL=y"; do
            KEY=$(echo "$FLAG" | cut -d= -f1)
            grep -q "^${KEY}[=\ ]" "$DEFCONFIG" || echo "$FLAG" >> "$DEFCONFIG"
          done

      - name: Build Project
        run: |
          git config --global user.email "you@example.com"
          git config --global user.name "wannq-github"
          export LOCALVERSION="${{ inputs.localversion || '-palaziks' }}"
          chmod +x ./build.sh
          ./build.sh all ${{ inputs.device_name || 'star' }} 2>&1 | tee /tmp/kbuild.log

          if [ ! -f arch/arm64/boot/Image ]; then
            echo "=== BUILD FAILED — last errors ==="
            grep -E "error:|undefined reference|FAILED|hunk FAILED" /tmp/kbuild.log | tail -50
            exit 1
          fi

      - name: Compress
        run: tar -czvf build.tar.gz ../out/anykernel/*.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-${{ inputs.device_name || 'star' }}-Manual-SuSFS
          path: build.tar.gz
