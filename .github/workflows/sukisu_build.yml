name: Build SukiSU Ultra + SuSFS (Manual Hook)

on:
  workflow_dispatch:
    inputs:
      device_name:
        description: 'Select target device'
        required: true
        default: 'star'
        type: choice
        options: [star, mars, venus]
      localversion:
        description: 'Custom version suffix'
        required: true
        default: '-palaziks'
      swap_size:
        description: 'Swap size in GB'
        required: true
        default: '16'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Dynamic Memory Allocation (Swap)
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: ${{ inputs.swap_size || '16' }}

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y clang lld llvm git make gcc flex bison bc \
            libssl-dev ccache libncurses5-dev libncursesw5-dev cmake \
            python3 python-is-python3 cpio curl patch rsync

      - name: Integrate SukiSU Ultra
        run: |
          set -e
          echo "=== Setting up SukiSU Ultra ==="
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main
          ln -sf "$(pwd)/KernelSU/kernel" drivers/kernelsu

          echo "=== Wire into drivers ==="
          grep -q "kernelsu" drivers/Makefile || echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          grep -q "kernelsu" drivers/Kconfig || sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

          # Исправляем базовые ошибки SukiSU для старых ядер
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_KernelPatch_patch/main/kpm/patch_linux" -o patch_linux
          chmod +x patch_linux
          ./patch_linux drivers/kernelsu

          echo "=== Aggressive Cleanup for 5.4 Compatibility ==="
          # Удаляем filter_count и pkg_observer, которые гарантированно вешают билд 5.4
          find drivers/kernelsu -type f -name "*.c" -exec sed -i '/filter_count/d' {} +
          sed -i '/pkg_observer.o/d' drivers/kernelsu/Makefile
          find drivers/kernelsu -type f -name "*.c" -exec sed -i 's/ksu_pkg_observer_init()/0/g' {} +
          find drivers/kernelsu -type f -name "*.c" -exec sed -i 's/ksu_pkg_observer_exit()//g' {} +
          find drivers/kernelsu -type f -name "*.c" -exec sed -i 's/module_exit(ksu_kernelsu_exit);/\/\/module_exit(ksu_kernelsu_exit);/g' {} +

      - name: Apply Manual Hooks (Legacy Style)
        run: |
          python3 << 'EOF'
          import sys, re

          def patch_file(filepath, pattern, replacement):
              try:
                  with open(filepath, 'r') as f: content = f.read()
                  if 'ksu_handle' in content: 
                      print(f'{filepath}: hook already present')
                      return
                  new_content, n = re.subn(pattern, replacement, content, count=1)
                  if n > 0:
                      with open(filepath, 'w') as f: f.write(new_content)
                      print(f'{filepath}: hook applied')
                  else:
                      print(f'ERROR: Anchor not found in {filepath}')
                      sys.exit(1)
              except Exception as e:
                  print(f"Error patching {filepath}: {e}")
                  sys.exit(1)

          # fs/exec.c — hook in __do_execve_file
          patch_file('fs/exec.c', 
                     r'(char \*pathbuf = NULL;)', 
                     r'\1\n#ifdef CONFIG_KSU\n\textern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);\n\tksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);\n#endif\n')

          # fs/open.c — hook in do_faccessat
          patch_file('fs/open.c', 
                     r'(struct cred \*override_cred;)', 
                     r'\1\n#ifdef CONFIG_KSU\n\textern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags);\n\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n#endif\n')

          # fs/read_write.c — hook in vfs_read
          patch_file('fs/read_write.c', 
                     r'(ssize_t ret;\n\n\tret = rw_verify_area\(READ, file, pos, count\);)', 
                     r'#ifdef CONFIG_KSU\n\textern int ksu_handle_vfs_read(struct file **file_ptr, char __user **buf_ptr, size_t *count_ptr, loff_t **pos);\n\tksu_handle_vfs_read(&file, &buf, &count, &pos);\n#endif\n\t\1')

          # fs/stat.c — hook in vfs_statx
          patch_file('fs/stat.c', 
                     r'(int error = -EINVAL;)', 
                     r'\1\n#ifdef CONFIG_KSU\n\textern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);\n\tksu_handle_stat(&dfd, &filename, &flags);\n#endif\n')
          EOF

      - name: Apply JackA1ltman NonGKI Patches (Special for star)
        run: |
          set -e
          echo "=== Cloning Specialized Patches for Mi 11 Ultra ==="
          git clone --depth=1 https://github.com/JackA1ltman/NonGKI_Kernel_Patches.git -b mi_kernel ../altman_patches
          ALTMAN_DIR="$(pwd)/../altman_patches/mi11u_hyperos"

          # Фикс структур HyperOS A14
          patch -p1 < "$ALTMAN_DIR/hyperos_a14_fixed.patch" || true

          # Исправленный SuSFS патч для MIUI (заменяет стандартный)
          patch -p1 < "$ALTMAN_DIR/hyper_susfs_157_fixed.patch" || true
          
          # Финальная зачистка следов su
          patch -p1 < "$ALTMAN_DIR/hyper_susfs_remove_all_sus_su.patch" || true

      - name: Setup SuSFS Source Files
        run: |
          set -e
          echo "=== Cloning SuSFS Source Files (kernel-5.4) ==="
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b kernel-5.4 ../susfs4ksu
          SUSFS_DIR="$(pwd)/../susfs4ksu"

          # Копируем исходники SuSFS (логику патча мы уже наложили выше)
          cp -v "$SUSFS_DIR/kernel_patches/fs/susfs.c"               fs/
          cp -v "$SUSFS_DIR/kernel_patches/include/linux/susfs.h"     include/linux/
          cp -v "$SUSFS_DIR/kernel_patches/include/linux/susfs_def.h" include/linux/
          grep -q "susfs.o" fs/Makefile || echo "obj-y += susfs.o" >> fs/Makefile

      - name: Final MIUI Compatibility Fixes
        run: |
          set -e
          # Фикс заголовков в mount.h и susfs.h
          grep -q "susfs_mnt_id_backup" include/linux/mount.h || sed -i '/int mnt_flags;/a \ \ \ \ u64 susfs_mnt_id_backup;' include/linux/mount.h
          [ -f include/linux/susfs.h ] && grep -q "^struct kstat;" include/linux/susfs.h || sed -i '1s/^/struct kstat;\n/' include/linux/susfs.h || true
          
          # Прописываем инклуды SuSFS в proc файлы
          for f in fs/proc/task_mmu.c fs/proc/fd.c; do
            [ -f $f ] && (grep -q "linux/susfs.h" $f || sed -i '1i #include <linux/susfs.h>' $f)
          done

          # Бэкпорты для KernelSU на ядре 5.4
          find drivers/kernelsu -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's|#include <linux/pgtable.h>|#include <asm/pgtable.h>|g' {} + || true
          find drivers/kernelsu -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's/strncpy_from_user_nofault/strncpy_from_user/g' {} + || true
          [ -f drivers/kernelsu/allowlist.c ] && sed -i 's/TWA_RESUME/true/g' drivers/kernelsu/allowlist.c || true

      - name: Append Defconfig Flags
        run: |
          set -e
          DEVICE="${{ inputs.device_name || 'star' }}"
          DEFCONFIG=$(find arch/arm64/configs -name "*${DEVICE}*defconfig" | head -n 1)
          echo "Using defconfig: $DEFCONFIG"

          for FLAG in \
            "CONFIG_KSU=y" "CONFIG_KSU_MANUAL_HOOK=y" "CONFIG_KSU_DEBUG=n" \
            "CONFIG_KSU_SUSFS=y" "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" "CONFIG_KSU_SUSFS_SUS_MOUNT=y" \
            "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" "CONFIG_KSU_SUSFS_ENABLE_LOG=y" "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" \
            "CONFIG_KPM=y" "CONFIG_KALLSYMS=y" "CONFIG_KALLSYMS_ALL=y"; do
            KEY=$(echo "$FLAG" | cut -d= -f1)
            grep -q "^${KEY}[=\ ]" "$DEFCONFIG" || echo "$FLAG" >> "$DEFCONFIG"
          done

      - name: Build Project
        run: |
          git config --global user.email "bot@example.com"
          git config --global user.name "wannq"
          export LOCALVERSION="${{ inputs.localversion || '-palaziks' }}"
          chmod +x ./build.sh
          ./build.sh all ${{ inputs.device_name || 'star' }} 2>&1 | tee /tmp/kbuild.log

          if [ ! -f arch/arm64/boot/Image ]; then
            echo "BUILD FAILED"
            grep -E "error:|FAILED" /tmp/kbuild.log | tail -50
            exit 1
          fi

      - name: Compress & Upload
        run: tar -czvf build.tar.gz ../out/anykernel/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Kernel-${{ inputs.device_name }}-Manual-SukiSU-SuSFS
          path: build.tar.gz
