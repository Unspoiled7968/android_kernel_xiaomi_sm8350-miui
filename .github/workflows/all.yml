name: Build KernelSU Variants + SuSFS

on:
  workflow_dispatch:
    inputs:
      device_name:
        description: 'Select target device'
        required: true
        default: 'star'
        type: choice
        options: [star, mars, venus]
      ksu_variant:
        description: 'Select KernelSU variant'
        required: true
        default: 'ReSukiSU'
        type: choice
        options: [SukiSU, ReSukiSU, KernelSU, KernelSU-Next, WildKSU]
      localversion:
        description: 'Custom version suffix'
        required: true
        default: '-palaziks'
        type: string
      swap_size:
        description: 'Swap size in GB'
        required: true
        default: '16'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Dynamic Memory Allocation (Swap)
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: ${{ inputs.swap_size || '16' }}

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y clang lld llvm git make gcc flex bison bc \
            libssl-dev ccache libncurses5-dev libncursesw5-dev cmake \
            python3 python-is-python3 cpio curl patch rsync zip

      - name: Integrate Selected KernelSU Variant
        run: |
          set -e
          VARIANT="${{ inputs.ksu_variant }}"
          echo "=== Setting up $VARIANT ==="

          if [ "$VARIANT" = "SukiSU" ]; then
            curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s susfs-main
          elif [ "$VARIANT" = "ReSukiSU" ]; then
            curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s main
          elif [ "$VARIANT" = "KernelSU" ]; then
            curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
          elif [ "$VARIANT" = "KernelSU-Next" ]; then
            curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -s next
          elif [ "$VARIANT" = "WildKSU" ]; then
            curl -LSs "https://raw.githubusercontent.com/WildKernels/Wild_KSU/wild/kernel/setup.sh" | bash -s wild
          fi

          echo "=== Finding KSU kernel directory ==="
          KSU_KERNEL_DIR=$(find . -maxdepth 3 -type d -name "kernel" \
            | grep -E "KernelSU|KernelSU-Next|Wild_KSU" | head -n 1)

          if [ -z "$KSU_KERNEL_DIR" ]; then
            echo "ERROR: KSU kernel dir not found!"
            find . -maxdepth 3 -type d | head -30
            exit 1
          fi

          echo "Found KSU kernel dir: $KSU_KERNEL_DIR"
          ln -sf "$(pwd)/$KSU_KERNEL_DIR" drivers/kernelsu

          grep -q "kernelsu" drivers/Makefile || \
            echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          grep -q "kernelsu" drivers/Kconfig || \
            sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

          echo "=== Verify ==="
          ls -la drivers/kernelsu/
          echo "KSU variant: $VARIANT"

      - name: Apply KSU Manual Hooks
        run: |
          python3 << 'EOF'
          import sys

          def insert_after(filepath, search, insertion):
              with open(filepath, 'r') as f:
                  content = f.read()
              if 'ksu_handle' in content:
                  print(f'{filepath}: hook already present, skipping')
                  return
              if search not in content:
                  print(f'ERROR: anchor not found in {filepath}: {repr(search)}')
                  sys.exit(1)
              content = content.replace(search, search + insertion, 1)
              with open(filepath, 'w') as f:
                  f.write(content)
              print(f'{filepath}: hook applied')

          insert_after(
              'fs/exec.c',
              '\tchar *pathbuf = NULL;\n',
              '#ifdef CONFIG_KSU\n'
              '\textern int ksu_handle_execveat(int *fd, struct filename **filename_ptr,\n'
              '\t\t\t\t       void *argv, void *envp, int *flags);\n'
              '\tksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);\n'
              '#endif\n'
          )

          insert_after(
              'fs/open.c',
              '\tconst struct cred *old_cred;\n\tstruct cred *override_cred;\n',
              '#ifdef CONFIG_KSU\n'
              '\textern int ksu_handle_faccessat(int *dfd, const char __user **filename_user,\n'
              '\t\t\t\t\tint *mode, int *flags);\n'
              '\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n'
              '#endif\n'
          )

          insert_after(
              'fs/read_write.c',
              'ssize_t vfs_read(struct file *file, char __user *buf, size_t count, loff_t *pos)\n{\n\tssize_t ret;\n',
              '#ifdef CONFIG_KSU\n'
              '\textern int ksu_handle_vfs_read(struct file **file_ptr, char __user **buf_ptr,\n'
              '\t\t\t\t       size_t *count_ptr, loff_t **pos);\n'
              '\tksu_handle_vfs_read(&file, &buf, &count, &pos);\n'
              '#endif\n'
          )

          insert_after(
              'fs/stat.c',
              '\tint error = -EINVAL;\n',
              '#ifdef CONFIG_KSU\n'
              '\textern int ksu_handle_stat(int *dfd, const char __user **filename_user,\n'
              '\t\t\t\t   int *flags);\n'
              '\tksu_handle_stat(&dfd, &filename, &flags);\n'
              '#endif\n'
          )
          EOF

          echo "=== Verify hooks ==="
          grep -n "ksu_handle" fs/exec.c fs/open.c fs/read_write.c fs/stat.c

      - name: Apply Compatibility Fixes for MIUI 5.4 QGKI
        run: |
          set -e

          echo "=== Fix: pgtable.h (linux -> asm) ==="
          find -L drivers/kernelsu -type f \( -name "*.c" -o -name "*.h" \) | while read f; do
            if grep -q "linux/pgtable.h" "$f"; then
              sed -i 's|#include <linux/pgtable.h>|#include <asm/pgtable.h>|g' "$f"
              echo "Fixed pgtable in $f"
            fi
          done

          echo "=== Fix: nofault API shims -> uaccess.h ==="
          if ! grep -q "strncpy_from_user_nofault" include/linux/uaccess.h; then
            cat >> include/linux/uaccess.h << 'UACCESS'
          /* 5.4 compat shims for APIs added in 5.8 */
          #ifndef strncpy_from_user_nofault
          #define strncpy_from_user_nofault(dst, src, size) strncpy_from_user(dst, src, size)
          #endif
          #ifndef copy_from_user_nofault
          #define copy_from_user_nofault(dst, src, size)    copy_from_user(dst, src, size)
          #endif
          #ifndef copy_to_user_nofault
          #define copy_to_user_nofault(dst, src, size)      copy_to_user(dst, src, size)
          #endif
          #ifndef copy_from_kernel_nofault
          #define copy_from_kernel_nofault(dst, src, size)  probe_kernel_read(dst, src, size)
          #endif
          UACCESS
            echo "Added nofault shims to uaccess.h"
          fi

          echo "=== Fix: uapi/*.h and relative header path resolution ==="
          find -L drivers/kernelsu -type f \( -name "*.c" -o -name "*.h" \) | \
            xargs grep -l '"uapi/' 2>/dev/null | while read f; do
              fdir=$(dirname "$f")
              grep -o '"uapi/[^"]*"' "$f" 2>/dev/null | sort -u | while read inc; do
                filename=$(echo "$inc" | sed 's|"uapi/||;s|"||')
                actual=$(find -L drivers/kernelsu -name "$filename" 2>/dev/null | head -n 1)
                if [ -n "$actual" ]; then
                  rel=$(python3 -c "import os; print(os.path.relpath('$actual', '$fdir'))")
                  sed -i "s|\"uapi/$filename\"|\"$rel\"|g" "$f"
                  echo "Fixed uapi/$filename -> $rel in $f"
                fi
              done
            done

          echo "=== Fix: klog.h and other local headers not found in subdirs ==="
          # KernelSU tiann новая структура: core/, policy/ ищут хедеры из корня kernel/
          # Копируем все .h из корня KSU в подпапки которые их не видят
          KSU_ROOT=$(find -L drivers/kernelsu -maxdepth 0 -type l -exec readlink -f {} \; 2>/dev/null || \
                     find . -maxdepth 3 -type d -name "kernel" | grep -E "KernelSU" | head -n 1)
          if [ -n "$KSU_ROOT" ]; then
            # Для каждой подпапки у которой есть .c файлы с "#include "xxx.h"" без пути —
            # проверяем есть ли этот хедер в корне KSU и если нет — создаём симлинк
            find -L drivers/kernelsu -mindepth 2 -name "*.c" | while read srcfile; do
              subdir=$(dirname "$srcfile")
              grep -o '"[a-zA-Z_][a-zA-Z0-9_/]*\.h"' "$srcfile" 2>/dev/null | \
                grep -v "/" | sed 's/"//g' | while read hdr; do
                  # хедер без пути — ищем его в корне KSU
                  if [ ! -f "$subdir/$hdr" ]; then
                    actual=$(find -L "$KSU_ROOT" -maxdepth 1 -name "$hdr" 2>/dev/null | head -n 1)
                    if [ -n "$actual" ]; then
                      ln -sf "$actual" "$subdir/$hdr" 2>/dev/null || true
                      echo "Symlinked $hdr into $subdir"
                    fi
                  fi
                done
            done
          fi

          echo "=== Fix: TWA_RESUME compat ==="
          find -L drivers/kernelsu -type f -name "*.c" | \
            xargs grep -l "TWA_RESUME" 2>/dev/null | while read f; do
              sed -i 's/TWA_RESUME/true/g' "$f"
              echo "Fixed TWA_RESUME in $f"
            done

          echo "=== Fix: put_task_struct header ==="
          find -L drivers/kernelsu -name "allowlist.c" | while read f; do
            grep -q "linux/sched/task.h" "$f" || \
              sed -i '1s/^/#include <linux\/sched\/task.h>\n/' "$f"
          done

          echo "=== Fix: ksu_is_ksu_domain -> is_ksu_domain (KernelSU Next rename) ==="
          find -L drivers/kernelsu -type f -name "*.c" | \
            xargs grep -l "ksu_is_ksu_domain" 2>/dev/null | while read f; do
              sed -i 's/ksu_is_ksu_domain()/is_ksu_domain()/g' "$f"
              echo "Fixed ksu_is_ksu_domain in $f"
            done

          echo "=== Fix: filter_count removal ==="
          find -L drivers/kernelsu -type f -name "*.c" | \
            xargs grep -l "filter_count" 2>/dev/null | while read f; do
              sed -i '/filter_count/d' "$f"
              echo "Removed filter_count from $f"
            done

          echo "=== Fix: module_init/module_exit in ksu.c ==="
          find -L drivers/kernelsu -name "ksu.c" | while read f; do
            if grep -q "module_init(kernelsu_init)" "$f" && \
               ! grep -qE "^int kernelsu_init|^static int kernelsu_init" "$f"; then
              sed -i 's/^module_init(kernelsu_init);/\/\/module_init(kernelsu_init);/' "$f"
              echo "Commented module_init(kernelsu_init) in $f"
            fi
            sed -i 's/^module_exit(ksu_kernelsu_exit);/\/\/module_exit(ksu_kernelsu_exit);/' "$f"
            sed -i 's/^module_exit(kernelsu_exit);/\/\/module_exit(kernelsu_exit);/' "$f"
          done

          echo "=== Fix: pkg_observer.c stub (fsnotify API incompatible with 5.4) ==="
          find -L drivers/kernelsu -name "pkg_observer.c" | while read f; do
            cat > "$f" << 'STUB'
          #include <linux/types.h>
          #include <linux/init.h>
          int ksu_pkg_observer_init(void) { return 0; }
          void ksu_pkg_observer_exit(void) { return; }
          STUB
            echo "Replaced pkg_observer.c with stub: $f"
          done

          echo "=== Fix: sepolicy.c diagnostic suppress ==="
          find -L drivers/kernelsu -name "sepolicy.c" | while read f; do
            if grep -q "filename_trans_key\|policydb_filenametr_search\|hashtab_duplicate\|avtab_alloc_dup" "$f"; then
              sed -i '1s/^/#pragma clang diagnostic push\n#pragma clang diagnostic ignored "-Wimplicit-function-declaration"\n#pragma clang diagnostic ignored "-Wincompatible-pointer-types"\n#pragma clang diagnostic ignored "-Wincompatible-function-pointer-types"\n/' "$f"
              echo '#pragma clang diagnostic pop' >> "$f"
              echo "Applied diagnostic suppress to $f"
            fi
          done

          echo "=== Fix: susfs_is_current_proc stubs (WildKSU) ==="
          find -L drivers/kernelsu -name "sucompat.c" | while read f; do
            if grep -q "susfs_is_current_proc_umounted\|susfs_set_current_proc_umounted" "$f"; then
              grep -q "susfs_is_current_proc_umounted" fs/susfs.c 2>/dev/null || \
                sed -i '1s/^/bool susfs_is_current_proc_umounted(void) { return false; }\nvoid susfs_set_current_proc_umounted(void) { }\n/' "$f" || true
            fi
          done

      - name: Setup SuSFS
        run: |
          set -e
          SUSFS_DIR="$(pwd)/../susfs4ksu"

          if [ ! -d "$SUSFS_DIR" ]; then
            echo "=== Cloning SuSFS kernel-5.4 ==="
            git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b kernel-5.4 "$SUSFS_DIR"
          fi

          echo "=== Apply SuSFS patch to KernelSU ==="
          KSU_KERNEL=$(find . -maxdepth 3 -type d -name "kernel" \
            | grep -E "KernelSU|Wild_KSU" | head -n 1)
          if [ -n "$KSU_KERNEL" ]; then
            cd "$KSU_KERNEL"
            patch -p1 < "$SUSFS_DIR/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch" \
              && echo "KSU susfs patch applied" || echo "KSU susfs patch skipped"
            cd - > /dev/null
          fi

          echo "=== Apply SuSFS patch to kernel tree ==="
          patch -p1 < "$SUSFS_DIR/kernel_patches/50_add_susfs_in_kernel-5.4.patch" \
            && echo "Kernel susfs patch applied" \
            || echo "Kernel susfs patch had errors (continuing)"

          echo "=== Copy SuSFS source files ==="
          cp -v "$SUSFS_DIR/kernel_patches/fs/susfs.c"               fs/
          cp -v "$SUSFS_DIR/kernel_patches/include/linux/susfs.h"     include/linux/
          cp -v "$SUSFS_DIR/kernel_patches/include/linux/susfs_def.h" include/linux/

          grep -q "susfs.o" fs/Makefile || echo "obj-y += susfs.o" >> fs/Makefile

          echo "=== SuSFS structural fixes ==="
          grep -q "susfs_mnt_id_backup" include/linux/mount.h || \
            sed -i '/int mnt_flags;/a \ \ \ \ u64 susfs_mnt_id_backup;' include/linux/mount.h

          grep -q "^struct kstat;" include/linux/susfs.h || \
            sed -i '1s/^/struct kstat;\n/' include/linux/susfs.h

          grep -q "linux/susfs.h" fs/proc/task_mmu.c || \
            sed -i '1s/^/#include <linux\/susfs.h>\n/' fs/proc/task_mmu.c
          grep -q "linux/susfs.h" fs/proc/fd.c || \
            sed -i '1s/^/#include <linux\/susfs.h>\n/' fs/proc/fd.c

      - name: Append Flags to Defconfig
        run: |
          set -e
          DEVICE="${{ inputs.device_name || 'star' }}"
          DEFCONFIG=$(find arch/arm64/configs -name "*${DEVICE}*defconfig" | head -n 1)
          if [ -z "$DEFCONFIG" ]; then
            echo "CRITICAL: defconfig not found for ${DEVICE}"
            exit 1
          fi
          echo "Using defconfig: $DEFCONFIG"

          for FLAG in \
            "CONFIG_KSU=y" \
            "CONFIG_KSU_DEBUG=n" \
            "CONFIG_KSU_SUSFS=y" \
            "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" \
            "CONFIG_KSU_SUSFS_SUS_MOUNT=y" \
            "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" \
            "CONFIG_KSU_SUSFS_ENABLE_LOG=y" \
            "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" \
            "CONFIG_KPM=y" \
            "CONFIG_KALLSYMS=y" \
            "CONFIG_KALLSYMS_ALL=y"; do
            KEY=$(echo "$FLAG" | cut -d= -f1)
            grep -q "^${KEY}[=\ ]" "$DEFCONFIG" || echo "$FLAG" >> "$DEFCONFIG"
          done

          echo "=== KSU flags ==="
          grep "KSU\|KPM\|KALLSYMS" "$DEFCONFIG" || true

      - name: Build Project
        run: |
          git config --global user.email "you@example.com"
          git config --global user.name "wannq-github"

          export LOCALVERSION="${{ inputs.localversion || '-palaziks' }}"

          chmod +x ./build.sh
          ./build.sh all ${{ inputs.device_name || 'star' }} 2>&1 | tee /tmp/kbuild.log

          if [ ! -f arch/arm64/boot/Image ]; then
            echo ""
            echo "=== BUILD FAILED — last errors ==="
            grep -E "error:|undefined reference|FAILED" /tmp/kbuild.log | tail -50
            exit 1
          fi
          echo "=== Image built successfully ==="

      - name: Compress
        run: tar -czvf build.tar.gz ../out/anykernel/*.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.device_name || 'star' }}-${{ inputs.ksu_variant }}-palaziks
          path: build.tar.gz
