name: Build KernelSU Variants + SuSFS

on:
  workflow_dispatch:
    inputs:
      device_name:
        description: 'Select target device'
        required: true
        default: 'star'
        type: choice
        options: [star, mars, venus]
      ksu_variant:
        description: 'Select KernelSU variant'
        required: true
        default: 'KernelSU-Next'
        type: choice
        options: [SukiSU, ReSukiSU, KernelSU, KernelSU-Next, WildKSU]
      localversion:
        description: 'Custom version suffix'
        required: true
        default: '-palaziks'
        type: string
      swap_size:
        description: 'Swap size in GB'
        required: true
        default: '16'
        type: string
      disable_rear_screen:
        description: 'Disable rear display (star / Mi 11 Ultra only)'
        required: true
        default: 'false'
        type: choice
        options: ['false', 'true']
      hide_stuff:
        description: 'Apply Hide Stuff patches (not needed for SukiSU/ReSukiSU)'
        required: true
        default: 'false'
        type: choice
        options: ['false', 'true']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Dynamic Memory Allocation (Swap)
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: ${{ inputs.swap_size || '16' }}

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y clang lld llvm git make gcc flex bison bc \
            libssl-dev ccache libncurses5-dev libncursesw5-dev cmake \
            python3 python-is-python3 cpio curl patch rsync zip \
            coccinelle perl

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: 3G
          key: kernel-${{ inputs.device_name || 'star' }}-${{ inputs.ksu_variant }}

      - name: Create clang ccache wrappers
        run: |
          mkdir -p "$HOME/.ccache_wrappers"
          printf '#!/bin/sh\nexec ccache /usr/bin/clang "$@"\n' \
            > "$HOME/.ccache_wrappers/clang"
          printf '#!/bin/sh\nexec ccache /usr/bin/clang++ "$@"\n' \
            > "$HOME/.ccache_wrappers/clang++"
          chmod +x "$HOME/.ccache_wrappers/clang" \
                   "$HOME/.ccache_wrappers/clang++"
          echo "$HOME/.ccache_wrappers" >> "$GITHUB_PATH"

      - name: Apply Specialized MIUI Patches (JackA1ltman)
        run: |
          set -e
          git clone --depth=1 https://github.com/JackA1ltman/NonGKI_Kernel_Patches.git \
            -b mi_kernel ../altman_patches
          ALTMAN_DIR="$(pwd)/../altman_patches/mi11u_hyperos"
          patch -p1 --forward --batch < "$ALTMAN_DIR/hyperos_a14_fixed.patch"              || true
          patch -p1 --forward --batch < "$ALTMAN_DIR/hyper_susfs_157_fixed.patch"          || true
          patch -p1 --forward --batch < "$ALTMAN_DIR/hyper_susfs_remove_all_sus_su.patch" || true

      - name: Integrate Selected KernelSU Variant
        run: |
          set -e
          VARIANT="${{ inputs.ksu_variant }}"
          echo "=== Setting up $VARIANT ==="

          if [ "$VARIANT" = "SukiSU" ]; then
            curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s susfs-main
          elif [ "$VARIANT" = "ReSukiSU" ]; then
            curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s main
          elif [ "$VARIANT" = "KernelSU" ]; then
            curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
          elif [ "$VARIANT" = "KernelSU-Next" ]; then
            # sidex15 fork — legacy-susfs-v2 branch, SuSFS v2 already built-in
            curl -LSs "https://raw.githubusercontent.com/sidex15/KernelSU-Next/legacy-susfs-v2/kernel/setup.sh" | bash -s legacy-susfs-v2
          elif [ "$VARIANT" = "WildKSU" ]; then
            curl -LSs "https://raw.githubusercontent.com/WildKernels/Wild_KSU/wild/kernel/setup.sh" | bash -s wild
          fi

          echo "=== Verifying drivers/kernelsu ==="
          if [ ! -e drivers/kernelsu ]; then
            echo "ERROR: setup.sh did not create drivers/kernelsu!"
            ls -la drivers/ | grep -i ksu || true
            exit 1
          fi
          echo "drivers/kernelsu -> $(readlink drivers/kernelsu 2>/dev/null || echo '(not a symlink)')"

          KSU_REAL=$(realpath drivers/kernelsu)
          echo "KSU real path: $KSU_REAL"
          ls "$KSU_REAL/"

          echo "=== Fix: ksu_is_ksu_domain -> is_ksu_domain ==="
          grep -rlF "ksu_is_ksu_domain" "$KSU_REAL" 2>/dev/null | while read -r f; do
            echo "  patching: $f"
            sed -i 's/ksu_is_ksu_domain/is_ksu_domain/g' "$f"
          done

          echo "=== Fix: uapi include path ==="
          find "$KSU_REAL" \( -name "Makefile" -o -name "Kbuild" \) | while read -r mkfile; do
            grep -qF 'ccflags-y += -I$(srctree)/drivers/kernelsu' "$mkfile" 2>/dev/null && continue
            {
              echo 'ccflags-y += -I$(srctree)/drivers/kernelsu'
              echo 'ccflags-y += -I$(srctree)/drivers/kernelsu/uapi'
            } >> "$mkfile"
          done

          echo "=== Fix: copy uapi/ into KSU subdirs ==="
          if [ -d "$KSU_REAL/uapi" ]; then
            find "$KSU_REAL" -mindepth 1 -maxdepth 1 -type d ! -name "uapi" | while read -r d; do
              cp -rn "$KSU_REAL/uapi" "$d/" 2>/dev/null || true
            done
          fi

          echo "=== Fix: su_mount_ns.c stub (path_mount n/a in 5.4) ==="
          find "$KSU_REAL" -name "su_mount_ns.c" | while read -r f; do
            cat > "$f" << 'STUB'
          #include <linux/types.h>
          #include <linux/errno.h>
          #include <linux/init.h>
          int ksu_setup_mount_ns(void) { return 0; }
          void ksu_cleanup_mount_ns(void) { }
          int setup_mount_ns(void) { return 0; }
          STUB
          done

          echo "=== Fix: seccomp_cache.c stub (SECCOMP_ARCH_NATIVE_NR n/a in 5.4) ==="
          find "$KSU_REAL" -name "seccomp_cache.c" | while read -r f; do
            cat > "$f" << 'STUB'
          #include <linux/types.h>
          #include <linux/init.h>
          void ksu_seccomp_cache_init(void) { }
          int  ksu_seccomp_allow_cache(int nr) { return 1; }
          int  ksu_seccomp_cache_allow(int nr) { return 1; }
          void ksu_seccomp_cache_set(int nr, int allow) { }
          STUB
          done

          echo "=== Fix: app_profile.c seccomp.filter_count ==="
          find "$KSU_REAL" -name "app_profile.c" | while read -r f; do
            sed -i 's/atomic_set(&current->seccomp\.filter_count,.*)/\/\/ filter_count not in 5.4 seccomp struct/' "$f"
          done

          echo "=== Fix: pgtable.h ==="
          find "$KSU_REAL" -type f \( -name "*.c" -o -name "*.h" \) \
            -exec sed -i 's|#include <linux/pgtable.h>|#include <asm/pgtable.h>|g' {} + || true

          echo "=== Fix: Bypass Kbuild TP locks ==="
          find "$KSU_REAL" \( -name "Kbuild" -o -name "Makefile" \) | while read -r f; do
            sed -i '/TP hooks are incompatible/d' "$f"
            sed -i 's/$(error.*TP hooks are incompatible.*)//g' "$f"
          done

          echo "=== Fix: TWA_RESUME ==="
          find "$KSU_REAL" -type f -name "*.c" \
            -exec sed -i 's/TWA_RESUME/true/g' {} + || true

          echo "=== Fix: put_task_struct header ==="
          find "$KSU_REAL" -name "allowlist.c" | while read -r f; do
            grep -q "linux/sched/task.h" "$f" || \
              sed -i '1s/^/#include <linux\/sched\/task.h>\n/' "$f"
          done

          echo "=== Fix: pkg_observer ==="
          [ -f "$KSU_REAL/Makefile" ] && sed -i '/pkg_observer.o/d' "$KSU_REAL/Makefile" || true
          find "$KSU_REAL" -name "Makefile" -exec sed -i '/pkg_observer.o/d' {} + || true
          find "$KSU_REAL" -type f -name "*.c" \
            -exec sed -i 's/ksu_pkg_observer_init()/0/g' {} + || true
          find "$KSU_REAL" -type f -name "*.c" \
            -exec sed -i 's/ksu_pkg_observer_exit()//g' {} + || true

          echo "=== Fix: pkg_observer.c stub ==="
          find "$KSU_REAL" -name "pkg_observer.c" | while read -r f; do
            cat > "$f" << 'STUB'
          #include <linux/types.h>
          #include <linux/init.h>
          int ksu_pkg_observer_init(void) { return 0; }
          void ksu_pkg_observer_exit(void) { return; }
          int ksu_observer_init(void) { return 0; }
          void ksu_observer_exit(void) { }
          STUB
          done

          echo "=== Fix: module_init/module_exit ==="
          find "$KSU_REAL" -name "ksu.c" | while read -r f; do
            sed -i 's/^module_init(kernelsu_init);/\/\/module_init(kernelsu_init);/' "$f"
            sed -i 's/^module_exit(ksu_kernelsu_exit);/\/\/module_exit(ksu_kernelsu_exit);/' "$f"
            sed -i 's/^module_exit(kernelsu_exit);/\/\/module_exit(kernelsu_exit);/' "$f"
          done

          echo "=== Fix: selinux/rules.c stub ==="
          find "$KSU_REAL" -path "*/selinux/rules.c" | while read -r f; do
            cat > "$f" << 'STUB'
          #include <linux/types.h>
          #include <linux/init.h>
          void apply_kernelsu_rules(void) { }
          STUB
          done

          echo "=== Fix: selinux/sepolicy.c stub ==="
          find "$KSU_REAL" -path "*/selinux/sepolicy.c" | while read -r f; do
            cat > "$f" << 'STUB'
          #include <linux/types.h>
          #include <linux/init.h>
          void *ksu_dup_sepolicy(void *old_pol) { return NULL; }
          void ksu_free_sepolicy(void *pol) { }
          STUB
          done

          echo "=== Fix: sepolicy.c diagnostic suppress (non-selinux) ==="
          find "$KSU_REAL" -name "sepolicy.c" \
            ! -path "*/selinux/sepolicy.c" | while read -r f; do
            sed -i '1s/^/#pragma clang diagnostic push\n#pragma clang diagnostic ignored "-Wimplicit-function-declaration"\n#pragma clang diagnostic ignored "-Wincompatible-pointer-types"\n#pragma clang diagnostic ignored "-Wincompatible-function-pointer-types"\n/' "$f"
            echo '#pragma clang diagnostic pop' >> "$f"
          done

          echo "=== Fix: susfs_is_current_proc stubs ==="
          find "$KSU_REAL" -name "sucompat.c" | while read -r f; do
            grep -q "susfs_is_current_proc_umounted" "$f" && continue
            tmpfile=$(mktemp)
            cat > "$tmpfile" << 'STUB'
          #include <linux/types.h>
          #include <linux/kernel.h>
          static inline bool _susfs_umounted_stub(void) { return false; }
          bool susfs_is_current_proc_umounted(void) { return _susfs_umounted_stub(); }
          void susfs_set_current_proc_umounted(void) { }
          STUB
            cat "$f" >> "$tmpfile"
            mv "$tmpfile" "$f"
          done

          echo "=== Fix: dispatch.c tasklist_lock ==="
          find "$KSU_REAL" -name "dispatch.c" | while read -r f; do
            sed -i 's/write_lock_irq(&tasklist_lock);/\/\/write_lock_irq(\&tasklist_lock);/g' "$f"
            sed -i 's/write_unlock_irq(&tasklist_lock);/\/\/write_unlock_irq(\&tasklist_lock);/g' "$f"
            sed -i 's/struct pid \*init_group = task_pgrp(&init_task);/struct pid *init_group = NULL;/g' "$f"
            sed -i 's/task_session(p) != task_session(&init_task)/0/g' "$f"
            sed -i 's/task_pgrp(p) != init_group/0/g' "$f"
          done

          echo "=== Fix: minmax.h -> kernel.h ==="
          grep -rl 'linux/minmax.h' "$KSU_REAL" | xargs -r sed -i 's|linux/minmax\.h|linux/kernel\.h|g' || true

          grep -q "kernelsu" drivers/Makefile || \
            echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          grep -q "kernelsu" drivers/Kconfig || \
            sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

          echo "=== Final drivers/kernelsu/ ==="
          ls -la drivers/kernelsu/

      - name: Apply KSU Hooks
        run: |
          VARIANT="${{ inputs.ksu_variant }}"
          echo "=== Applying hooks for $VARIANT ==="

          if [[ "$VARIANT" == *"SukiSU"* ]]; then
            echo "-> Tracepoint hooks (SukiSU/ReSukiSU)"
            python3 << 'EOF'
          import sys, re, os

          def robust_patch(filepath, pattern, replacement):
              if not os.path.exists(filepath): return
              with open(filepath, 'r') as f: content = f.read()
              if 'ksu_trace' in content: return
              new_content, n = re.subn(pattern, replacement, content, count=1)
              if n > 0:
                  with open(filepath, 'w') as f: f.write(new_content)

          def add_include(filepath, include_path):
              if not os.path.exists(filepath): return
              with open(filepath, 'r') as f: content = f.read()
              if include_path in content: return
              new_content = re.sub(
                  r'(#include <linux/.*?\.h>\n)',
                  r'\1#if defined(CONFIG_KSU) && defined(CONFIG_KSU_TRACEPOINT_HOOK)\n#include '
                  + include_path + '\n#endif\n',
                  content, count=1)
              with open(filepath, 'w') as f: f.write(new_content)

          add_include('fs/exec.c', '<../drivers/kernelsu/ksu_trace.h>')
          robust_patch('fs/exec.c',
              r'(return do_execveat_common\(AT_FDCWD, filename, argv, envp, 0\);)',
              r'#if defined(CONFIG_KSU) && defined(CONFIG_KSU_TRACEPOINT_HOOK)\n\ttrace_ksu_trace_execveat_hook((int *)AT_FDCWD, &filename, &argv, &envp, 0);\n#endif\n\t\1')

          add_include('fs/open.c', '<../drivers/kernelsu/ksu_trace.h>')
          robust_patch('fs/open.c',
              r'(SYSCALL_DEFINE3\(faccessat, int, dfd, const char __user \*, filename, int, mode\)\n{)',
              r'\1\n#if defined(CONFIG_KSU) && defined(CONFIG_KSU_TRACEPOINT_HOOK)\n\ttrace_ksu_trace_faccessat_hook(&dfd, &filename, &mode, NULL);\n#endif\n')

          add_include('fs/read_write.c', '<../drivers/kernelsu/ksu_trace.h>')
          robust_patch('fs/read_write.c',
              r'(SYSCALL_DEFINE3\(read, unsigned int, fd, char __user \*, buf, size_t, count\)\n{)',
              r'\1\n#if defined(CONFIG_KSU) && defined(CONFIG_KSU_TRACEPOINT_HOOK)\n\ttrace_ksu_trace_sys_read_hook(fd, &buf, &count);\n#endif\n')

          add_include('fs/stat.c', '<../drivers/kernelsu/ksu_trace.h>')
          robust_patch('fs/stat.c',
              r'(error = vfs_fstatat\(dfd, filename, &stat, flag\);)',
              r'#if defined(CONFIG_KSU) && defined(CONFIG_KSU_TRACEPOINT_HOOK)\n\ttrace_ksu_trace_stat_hook(&dfd, &filename, &flag);\n#endif\n\t\1')

          add_include('drivers/input/input.c', '<../../drivers/kernelsu/ksu_trace.h>')
          robust_patch('drivers/input/input.c',
              r'(void input_event\(struct input_dev \*dev,\n\t\t unsigned int type, unsigned int code, int value\)\n{\n\tunsigned long flags;\n)',
              r'\1\n#if defined(CONFIG_KSU) && defined(CONFIG_KSU_TRACEPOINT_HOOK)\n\ttrace_ksu_trace_input_hook(&type, &code, &value);\n#endif\n')
          EOF

          else
            echo "-> Inline hooks (KernelSU/KernelSU-Next/WildKSU)"
            python3 << 'EOF'
          import os

          def insert_after(filepath, search, insertion):
              if not os.path.exists(filepath): return
              with open(filepath, 'r') as f: content = f.read()
              if 'ksu_handle' in content: return
              if search not in content:
                  print(f'WARNING: anchor not found in {filepath}')
                  return
              content = content.replace(search, search + insertion, 1)
              with open(filepath, 'w') as f: f.write(content)
              print(f'{filepath}: hook applied')

          insert_after('fs/exec.c',
              '\tchar *pathbuf = NULL;\n',
              '#ifdef CONFIG_KSU\n'
              '\textern int ksu_handle_execveat(int *fd, struct filename **filename_ptr,\n'
              '\t\t\t\t        void *argv, void *envp, int *flags);\n'
              '\tksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);\n'
              '#endif\n')

          insert_after('fs/open.c',
              '\tconst struct cred *old_cred;\n\tstruct cred *override_cred;\n',
              '#ifdef CONFIG_KSU\n'
              '\textern int ksu_handle_faccessat(int *dfd, const char __user **filename_user,\n'
              '\t\t\t\t\tint *mode, int *flags);\n'
              '\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n'
              '#endif\n')

          with open('fs/read_write.c', 'r') as f:
              rw = f.read()
          if 'ksu_handle_vfs_read' not in rw:
              insertion = (
                  '#ifdef CONFIG_KSU\n'
                  '\textern int ksu_handle_vfs_read(struct file **file_ptr, char __user **buf_ptr,\n'
                  '\t\t\t\t        size_t *count_ptr, loff_t **pos);\n'
                  '\tksu_handle_vfs_read(&file, &buf, &count, &pos);\n'
                  '#endif\n'
              )
              anchor1 = 'ssize_t vfs_read(struct file *file, char __user *buf, size_t count, loff_t *pos)\n{\n\tssize_t ret;\n'
              anchor2 = 'ssize_t vfs_read(struct file *file, char __user *buf, size_t count, loff_t *pos)\n{\n'
              if anchor1 in rw:
                  rw = rw.replace(anchor1, anchor1 + insertion, 1)
                  print('fs/read_write.c: hook applied (anchor1)')
              elif anchor2 in rw:
                  rw = rw.replace(anchor2, anchor2 + insertion, 1)
                  print('fs/read_write.c: hook applied (anchor2)')
              else:
                  print('WARNING: vfs_read anchor not found')
              with open('fs/read_write.c', 'w') as f:
                  f.write(rw)

          insert_after('fs/stat.c',
              '\tint error = -EINVAL;\n',
              '#ifdef CONFIG_KSU\n'
              '\textern int ksu_handle_stat(int *dfd, const char __user **filename_user,\n'
              '\t\t\t\t   int *flags);\n'
              '\tksu_handle_stat(&dfd, &filename, &flags);\n'
              '#endif\n')
          EOF
          fi

      - name: Apply Compatibility Fixes for MIUI 5.4 QGKI
        run: |
          set -e

          echo "=== Fix: nofault API shims ==="
          if ! grep -q "strncpy_from_user_nofault" include/linux/uaccess.h; then
            cat >> include/linux/uaccess.h << 'UACCESS'
          /* 5.4 compat shims for APIs added in 5.8+ */
          #ifndef strncpy_from_user_nofault
          #define strncpy_from_user_nofault(dst, src, size) strncpy_from_user(dst, src, size)
          #endif
          #ifndef copy_from_user_nofault
          #define copy_from_user_nofault(dst, src, size)    copy_from_user(dst, src, size)
          #endif
          #ifndef copy_to_user_nofault
          #define copy_to_user_nofault(dst, src, size)      copy_to_user(dst, src, size)
          #endif
          #ifndef copy_from_kernel_nofault
          #define copy_from_kernel_nofault(dst, src, size)  probe_kernel_read(dst, src, size)
          #endif
          #ifndef copy_to_kernel_nofault
          #define copy_to_kernel_nofault(dst, src, size)    probe_kernel_write(dst, src, size)
          #endif
          UACCESS
          fi

          echo "=== Fix: security_inode_init_security_anon (added in 5.9) ==="
          python3 << 'EOF'
          path = 'include/linux/security.h'
          with open(path, 'r') as f:
              content = f.read()
          if 'security_inode_init_security_anon' in content:
              print('Already present, skipping')
          else:
              stub = (
                  '\n/* 5.4 compat: security_inode_init_security_anon added in 5.9 */\n'
                  '#ifndef security_inode_init_security_anon\n'
                  'static inline int security_inode_init_security_anon(\n'
                  '\t\tstruct inode *inode,\n'
                  '\t\tconst struct qstr *name,\n'
                  '\t\tconst struct inode *context_inode)\n'
                  '{\n\treturn 0;\n}\n'
                  '#endif\n'
              )
              idx = content.rfind('#endif')
              if idx != -1:
                  content = content[:idx] + stub + content[idx:]
              else:
                  content += stub
              with open(path, 'w') as f:
                  f.write(content)
              print('Added security_inode_init_security_anon stub')
          EOF

          echo "=== Fix: LTO stubs — отдельный файл без LTO ==="
          KSU_REAL=$(realpath drivers/kernelsu)
          KSU_MK="$KSU_REAL/Makefile"

          cat > "$KSU_REAL/compat_5_4_stubs.c" << 'STUBS'
          #include <linux/types.h>
          #include <linux/errno.h>
          #include <linux/sched.h>
          #include <linux/fs.h>
          struct filename;
          struct path;
          int ksu_handle_vfs_read(struct file **fp, char __user **bp, size_t *cp, loff_t **pp) { return 0; }
          int ksu_handle_execveat(int *fd, struct filename **fnp, void *argv, void *envp, int *flags) { return 0; }
          int ksu_handle_faccessat(int *dfd, const char __user **fn, int *mode, int *flags) { return 0; }
          int ksu_handle_stat(int *dfd, const char __user **fn, int *flags) { return 0; }
          int handle_sepolicy(void __user *ud, u64 len) { return 0; }
          void seccomp_filter_release(struct task_struct *tsk) {}
          int ksu_observer_init(void) { return 0; }
          void ksu_observer_exit(void) {}
          int path_mount(const char *dev_name, struct path *path, const char *type_page, unsigned long flags, void *data_page) { return -ENOSYS; }
          STUBS

          # Определяем имя obj-переменной в Makefile KSU
          echo "=== Detecting KSU Makefile obj variable ==="
          head -30 "$KSU_MK"
          OBJ_VAR=$(grep -oE '^(kernelsu|ksu)-y' "$KSU_MK" | head -1)
          if [ -z "$OBJ_VAR" ]; then
            OBJ_VAR=$(grep -oE '^obj-y' "$KSU_MK" | head -1)
          fi
          if [ -z "$OBJ_VAR" ]; then
            OBJ_VAR="kernelsu-y"
          fi
          echo "Using obj variable: $OBJ_VAR"

          # LTO отключаем для стаб-файла, добавляем в сборку
          echo "CFLAGS_compat_5_4_stubs.o := \$(filter-out -flto%,\$(KBUILD_CFLAGS))" >> "$KSU_MK"
          echo "${OBJ_VAR} += compat_5_4_stubs.o" >> "$KSU_MK"

          # Для KernelSU-Next (sidex15) sucompat.c уже содержит реальные ksu_handle_* —
          # убираем из стаб-файла те функции которые там уже определены
          if grep -q "ksu_handle_faccessat\|ksu_handle_stat\|ksu_handle_vfs_read\|ksu_handle_execveat" \
              "$KSU_REAL/sucompat.c" 2>/dev/null; then
            echo "=== sucompat.c has real hooks — removing duplicate stubs ==="
            python3 << 'EOF'
          import re
          path = 'drivers/kernelsu/compat_5_4_stubs.c'
          # Читаем реальные определения из sucompat.c
          import subprocess, os
          sucompat = os.path.join(os.path.dirname(path), 'sucompat.c')
          defined = set()
          with open(sucompat) as f:
              for line in f:
                  m = re.match(r'^(?:static\s+)?(?:\w+\s+)+(\w+)\s*\(', line)
                  if m:
                      defined.add(m.group(1))
          with open(path) as f:
              content = f.read()
          # Удаляем строки-стабы для функций которые уже определены в sucompat.c
          lines = content.splitlines(keepends=True)
          out = []
          for line in lines:
              m = re.search(r'\b(\w+ksu_handle\w*|handle_sepolicy|seccomp_filter_release|ksu_observer_\w+|path_mount)\b', line)
              if m and m.group(1) in defined:
                  out.append(f'// REMOVED (defined in sucompat.c): {line}')
              else:
                  out.append(line)
          with open(path, 'w') as f:
              f.writelines(out)
          print('Deduped stubs written')
          EOF
          fi

          echo "=== Final compat_5_4_stubs.c ==="
          cat "$KSU_REAL/compat_5_4_stubs.c"
          echo "=== KSU Makefile tail ==="
          tail -5 "$KSU_MK"

      - name: Setup SuSFS
        run: |
          set -e
          VARIANT="${{ inputs.ksu_variant }}"
          SUSFS_DIR="$(pwd)/../susfs4ksu"

          # KernelSU-Next (sidex15 legacy-susfs-v2) уже включает SuSFS —
          # клонируем susfs4ksu только для файлов ядра (susfs.c, susfs.h)
          # и для других вариантов (KernelSU, WildKSU, SukiSU, ReSukiSU)
          if [ ! -d "$SUSFS_DIR" ]; then
            git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git \
              -b kernel-5.4 "$SUSFS_DIR"
          fi

          KSU_REAL=$(realpath drivers/kernelsu)

          # KSU-side patch: не нужен для SukiSU (built-in) и KernelSU-Next/sidex15 (built-in)
          if [ "$VARIANT" != "SukiSU" ] && [ "$VARIANT" != "KernelSU-Next" ]; then
            echo "=== Apply SuSFS patch to KernelSU ($VARIANT) ==="
            cd "$KSU_REAL"
            patch -p1 < "$SUSFS_DIR/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch" \
              && echo "KSU susfs patch applied" \
              || echo "KSU susfs patch skipped"
            cd - > /dev/null
          else
            echo "=== $VARIANT: SuSFS built-in, skipping KSU-side patch ==="
          fi

          echo "=== Apply SuSFS patch to kernel tree (JackA1ltman 5.4 patch) ==="
          curl -LSsO "https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/mainline/Patches/Patch/susfs_patch_to_5.4.patch"
          patch -p1 < susfs_patch_to_5.4.patch \
            && echo "Kernel susfs patch applied" \
            || echo "Kernel susfs patch had errors (continuing)"

          echo "=== Copy SuSFS source files ==="
          cp -v "$SUSFS_DIR/kernel_patches/fs/susfs.c"               fs/
          cp -v "$SUSFS_DIR/kernel_patches/include/linux/susfs.h"     include/linux/
          cp -v "$SUSFS_DIR/kernel_patches/include/linux/susfs_def.h" include/linux/

          grep -q "susfs.o" fs/Makefile || echo "obj-y += susfs.o" >> fs/Makefile

          echo "=== SuSFS structural fixes ==="
          grep -q "susfs_mnt_id_backup" include/linux/mount.h || \
            sed -i '/int mnt_flags;/a \ \ \ \ u64 susfs_mnt_id_backup;' include/linux/mount.h
          grep -q "^struct kstat;" include/linux/susfs.h || \
            sed -i '1s/^/struct kstat;\n/' include/linux/susfs.h
          grep -q "linux/susfs.h" fs/proc/task_mmu.c || \
            sed -i '1s/^/#include <linux\/susfs.h>\n/' fs/proc/task_mmu.c
          grep -q "linux/susfs.h" fs/proc/fd.c || \
            sed -i '1s/^/#include <linux\/susfs.h>\n/' fs/proc/fd.c
          grep -q "linux/susfs_def.h" include/linux/susfs.h || \
            sed -i '1s/^/#include <linux\/susfs_def.h>\n/' include/linux/susfs.h
          grep -q "struct dentry \*dentry" fs/proc/task_mmu.c || \
            sed -i '/const char \*name = NULL;/a\\tstruct dentry *dentry = NULL;' \
              fs/proc/task_mmu.c
          grep -q "linux/path.h" fs/susfs.c || \
            sed -i '1s/^/#include <linux\/path.h>\n/' fs/susfs.c
          grep -q "linux/dcache.h" fs/susfs.c || \
            sed -i '1s/^/#include <linux\/dcache.h>\n/' fs/susfs.c
          grep -q "linux/mount.h" fs/susfs.c || \
            sed -i '1s/^/#include <linux\/mount.h>\n/' fs/susfs.c

          echo "=== SuSFS setup complete ==="

      - name: Apply Hide Stuff (proc/maps hiding via Coccinelle)
        if: ${{ inputs.hide_stuff == 'true' && inputs.ksu_variant != 'SukiSU' && inputs.ksu_variant != 'ReSukiSU' }}
        run: |
          set -e
          PATCHES_DIR="$(pwd)/../altman_patches/HideStuff"
          if [ ! -d "$PATCHES_DIR" ]; then
            echo "WARNING: HideStuff patches not found, skipping"
            exit 0
          fi
          grep -q "show_vma_header_prefix_fake" fs/proc/task_mmu.c || \
            spatch --sp-file "$PATCHES_DIR/added_show_vma_header_prefix_fake.cocci" \
              --in-place fs/proc/task_mmu.c
          grep -q "struct dentry \*dentry" fs/proc/task_mmu.c || \
            sed -i '/const char \*name = NULL;/a\    struct dentry *dentry;' fs/proc/task_mmu.c
          grep -q "jit-zygote-cache" fs/proc/task_mmu.c || \
            spatch --sp-file "$PATCHES_DIR/function_hide_stuff.cocci" \
              --in-place fs/proc/task_mmu.c
          if ! grep -q "bypass:" fs/proc/task_mmu.c; then
            if grep -q 'if (show_vma_header_prefix' fs/proc/task_mmu.c; then
              perl -i -0pe \
                's/(if \(show_vma_header_prefix\(m, start, end, flags, pgoff, dev, ino\)\)\s+return;)/$1\nbypass:/s' \
                fs/proc/task_mmu.c
            else
              sed -i '/show_vma_header_prefix(m, start, end, flags, pgoff, dev, ino);/a\bypass:' \
                fs/proc/task_mmu.c
            fi
          fi
          grep -q "lineage" fs/proc/base.c || \
            spatch --sp-file "$PATCHES_DIR/function_hide_stuff_partii.cocci" \
              --in-place fs/proc/base.c
          if grep -q "/dev/ashmem" fs/proc/task_mmu.c; then
            sed -i 's|"/dev/ashmem (deleted)"|"/system/framework/framework-res.apk"|g' \
              fs/proc/task_mmu.c fs/proc/base.c
          fi

      - name: Append Flags to Defconfig
        run: |
          set -e
          VARIANT="${{ inputs.ksu_variant }}"
          DEVICE="${{ inputs.device_name || 'star' }}"
          DEFCONFIG=$(find arch/arm64/configs -name "*${DEVICE}*defconfig" | head -n 1)

          if [ -z "$DEFCONFIG" ]; then
            echo "CRITICAL: defconfig not found for ${DEVICE}"
            exit 1
          fi
          echo "Using defconfig: $DEFCONFIG"

          FLAGS=(
            "CONFIG_KSU=y"
            "CONFIG_KSU_NEXT=y"
            "CONFIG_KSU_DEBUG=n"
            "CONFIG_KPROBES=y"
            "CONFIG_HAVE_KPROBES=y"
            "CONFIG_KPROBE_EVENTS=y"
            "CONFIG_KSU_SUSFS=y"
            "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y"
            "CONFIG_KSU_SUSFS_SUS_MOUNT=y"
            "CONFIG_KSU_SUSFS_SUS_PATH=y"
            "CONFIG_KSU_SUSFS_SUS_KSTAT=y"
            "CONFIG_KSU_SUSFS_SPOOF_UNAME=y"
            "CONFIG_KSU_SUSFS_ENABLE_LOG=y"
            "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y"
            "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y"
            "CONFIG_KPM=y"
            "CONFIG_KALLSYMS=y"
            "CONFIG_KALLSYMS_ALL=y"
          )
          [[ "$VARIANT" == *"SukiSU"* ]] && \
            FLAGS+=("CONFIG_KSU_TRACEPOINT_HOOK=y")

          for FLAG in "${FLAGS[@]}"; do
            KEY=$(echo "$FLAG" | cut -d= -f1)
            grep -q "^${KEY}[=\ ]" "$DEFCONFIG" || echo "$FLAG" >> "$DEFCONFIG"
          done

          echo "=== Active KSU/SuSFS flags ==="
          grep -E "KSU|KPM|KALLSYMS|KPROBE" "$DEFCONFIG" || true

      - name: Disable Rear Screen (DTS)
        if: ${{ inputs.device_name == 'star' && inputs.disable_rear_screen == 'true' }}
        run: |
          set -e
          DTSI="arch/arm64/boot/dts/vendor/qcom/star-sm8350.dtsi"
          echo "=== Before ==="
          grep -n "sde_dsi1\|connectors" "$DTSI"
          python3 << 'PYEOF'
          import re
          path = "arch/arm64/boot/dts/vendor/qcom/star-sm8350.dtsi"
          with open(path) as f:
              src = f.read()
          if 'REAR_DISABLED' not in src:
              src = re.sub(r'(&sde_dsi1\s*\{)',
                           r'\1\n\tstatus = "disabled"; /* REAR_DISABLED */',
                           src, count=1)
          src = re.sub(r'(\bconnectors\s*=\s*<[^>]*?)\s*&sde_dsi1\b', r'\1', src)
          with open(path, 'w') as f:
              f.write(src)
          print("DTS patch applied.")
          PYEOF
          echo "=== After ==="
          grep -n "sde_dsi1\|connectors\|REAR_DISABLED" "$DTSI"

      - name: Apply Feature Flags (DT2W)
        run: |
          set -e
          DEVICE="${{ inputs.device_name || 'star' }}"
          XIAOMI_CFG="arch/arm64/configs/vendor/xiaomi_QGKI.config"
          DEVICE_CFG="arch/arm64/configs/vendor/${DEVICE}_QGKI.config"

          set_flag() {
            local file="$1" key="$2" val="$3"
            sed -i "/^${key}[= ]/d" "$file"
            sed -i "/^# ${key} is not set/d" "$file"
            echo "${key}=${val}" >> "$file"
          }

          set_flag "$XIAOMI_CFG" "CONFIG_TOUCHSCREEN_XIAOMI_TOUCHFEATURE_GESTURE" "y"
          set_flag "$DEVICE_CFG" "CONFIG_TOUCHSCREEN_ST_FTS_DOUBLETAP_WAKE"       "y"
          set_flag "$XIAOMI_CFG" "CONFIG_PM_WAKELOCKS"                              "y"

      - name: Build Project
        run: |
          git config --global user.email "you@example.com"
          git config --global user.name "wannq-github"

          export LOCALVERSION="${{ inputs.localversion || '-palaziks' }}"

          echo "clang -> $(which clang)"
          ccache --zero-stats > /dev/null 2>&1 || true

          chmod +x ./build.sh
          ./build.sh all ${{ inputs.device_name || 'star' }} 2>&1 | tee /tmp/kbuild.log

          if [ ! -f arch/arm64/boot/Image ] && \
             [ ! -f out/arch/arm64/boot/Image ] && \
             [ ! -f ../out/arch/arm64/boot/Image ]; then
            echo ""
            echo "=== BUILD FAILED — last errors ==="
            grep -E "error:|undefined reference|FAILED" /tmp/kbuild.log | tail -50
            exit 1
          fi

          echo "=== ccache stats ==="
          ccache -s | grep -E "Hits|Misses|files in cache|cache size" || true

      - name: Compress
        run: tar -czvf build.tar.gz ../out/anykernel/*.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.device_name || 'star' }}-${{ inputs.ksu_variant }}-palaziks
          path: build.tar.gz
