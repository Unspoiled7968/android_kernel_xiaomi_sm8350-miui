name: Build KernelSU Next + SuSFS

on:
  workflow_dispatch:
    inputs:
      device_name:
        description: 'Select target device'
        required: true
        default: 'star'
        type: choice
        options: [star, mars, venus]
      localversion:
        description: 'Custom version suffix'
        required: true
        default: '-next-palaziks'
      swap_size:
        description: 'Swap size in GB'
        required: true
        default: '16'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Dynamic Memory Allocation (Swap)
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: ${{ inputs.swap_size || '16' }}

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y clang lld llvm git make gcc flex bison bc \
            libssl-dev ccache libncurses5-dev libncursesw5-dev cmake \
            python3 python-is-python3 cpio curl patch rsync

      - name: ⚡ Setup KernelSU | 配置 KernelSU
        run: |
          echo "🛠️ 正在设置KernelSU..."
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/refs/heads/main/kernel/setup.sh" | bash -s main

          cd KernelSU

          KSU_VERSION=$(expr $(curl -sI "https://api.github.com/repos/tiann/KernelSU/commits?sha=main&per_page=1" | grep -i "link:" | sed -n 's/.*page=\([0-9]*\)>; rel="last".*/\1/p') "+" 30000)

          echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV

          sed -i "s/DKSU_VERSION=16/DKSU_VERSION=${KSU_VERSION}/" kernel/Kbuild
        
          echo "✅ KernelSU 配置完成"

      - name: Kernel 5.4 & KSU Next Compatibility Fixes
        run: |
          set -e
          echo "=== Fixing KSU Next for Kernel 5.4 ==="
          
          # 1. Замена pgtable.h для старых ядер
          find drivers/kernelsu -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's|#include <linux/pgtable.h>|#include <asm/pgtable.h>|g' {} + || true
          
          # 2. Бэкпорт функций копирования
          find drivers/kernelsu -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's/strncpy_from_user_nofault/strncpy_from_user/g' {} + || true
          
          # 3. Фикс TWA_RESUME (специфично для Non-GKI 5.4)
          [ -f drivers/kernelsu/allowlist.c ] && sed -i 's/TWA_RESUME/true/g' drivers/kernelsu/allowlist.c || true
          
          # 4. Отключение module_exit для встроенного ядра
          find drivers/kernelsu -type f -name "*.c" -exec sed -i 's/module_exit(ksu_kernelsu_exit);/\/\/module_exit(ksu_kernelsu_exit);/g' {} +

          # 5. ФИКС ОШИБКИ put_task_struct (Добавляем нужные заголовочные файлы)
          if [ -f drivers/kernelsu/allowlist.c ]; then
            sed -i '1i #include <linux/sched/task.h>' drivers/kernelsu/allowlist.c
            sed -i '1i #include <linux/sched.h>' drivers/kernelsu/allowlist.c
          fi
          
          # 6. ФИКС ОШИБКИ seccomp (удаляем filter_count, как было в SukiSU)
          find drivers/kernelsu -type f -name "*.c" -exec sed -i '/filter_count/d' {} +

      - name: Apply SuSFS 5.4 Patch
        run: |
          set -e
          echo "=== Applying SuSFS patch ==="
      
          git clone --depth=1 https://github.com/JackA1ltman/NonGKI_Kernel_Build_2nd.git ../susfs_patch_repo
      
          PATCH_FILE="../susfs_patch_repo/Patches/Patch/susfs_patch_to_5.4.patch"
      
          if [ ! -f "$PATCH_FILE" ]; then
            echo "❌ Patch not found!"
            exit 1
          fi
      
          patch -p1 --forward --batch < "$PATCH_FILE" || echo "Patch already applied or partially applied"

      - name: Setup SuSFS for KSU Next
        run: |
          set -e
          echo "=== Setting up SuSFS 1.5.7 ==="
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b kernel-5.4 ../susfs4ksu
          SUSFS_DIR="$(pwd)/../susfs4ksu"
          
          # Копируем заголовочные файлы и сурс
          cp -v "$SUSFS_DIR/kernel_patches/fs/susfs.c" fs/
          cp -v "$SUSFS_DIR/kernel_patches/include/linux/susfs.h" include/linux/
          cp -v "$SUSFS_DIR/kernel_patches/include/linux/susfs_def.h" include/linux/
          
          # Патчим KernelSU Next для поддержки SuSFS
          KSU_PATCH="$SUSFS_DIR/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"
          if [ -f "$KSU_PATCH" ]; then
             cp -v "$KSU_PATCH" drivers/kernelsu/
             cd drivers/kernelsu && patch -p1 < 10_enable_susfs_for_ksu.patch || echo "Patch already applied"
             cd ../..
          else
             echo "CRITICAL: Patch 10_enable_susfs_for_ksu.patch not found!"
             exit 1
          fi

          grep -q "susfs.o" fs/Makefile || echo "obj-y += susfs.o" >> fs/Makefile

      - name: Append Defconfig Flags
        run: |
          set -e

          DEVICE="${{ inputs.device_name || 'star' }}"
          DEFCONFIG=$(find arch/arm64/configs -name "*${DEVICE}*defconfig" | head -n 1)
          
          if [ -z "$DEFCONFIG" ] || [ ! -f "$DEFCONFIG" ]; then
            echo "❌ Defconfig not found!"
            exit 1
          fi
          
          echo "✅ Using defconfig: $DEFCONFIG"
          
          # Remove old entries if they exist (prevents duplicates)
          sed -i '/CONFIG_KSU/d' "$DEFCONFIG"
          sed -i '/CONFIG_TMPFS_XATTR/d' "$DEFCONFIG"
          sed -i '/CONFIG_TMPFS_POSIX_ACL/d' "$DEFCONFIG"
          sed -i '/CONFIG_KSU_SUSFS/d' "$DEFCONFIG"
          
          # Append fresh config
          echo "CONFIG_KSU=y" >> "$DEFCONFIG"
          echo "CONFIG_TMPFS_XATTR=y" >> "$DEFCONFIG"
          echo "CONFIG_TMPFS_POSIX_ACL=y" >> "$DEFCONFIG"
          
          echo "📦 Enabling SUSFS..."
          
          echo "CONFIG_KSU_SUSFS=y" >> "$DEFCONFIG"
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> "$DEFCONFIG"
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> "$DEFCONFIG"
          echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> "$DEFCONFIG"
          echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> "$DEFCONFIG"
          echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> "$DEFCONFIG"
          echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> "$DEFCONFIG"
          echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> "$DEFCONFIG"
          echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> "$DEFCONFIG"
          echo "CONFIG_KSU_SUSFS_SUS_MAP=y" >> "$DEFCONFIG"

      - name: Build Project
        run: |
          git config --global user.email "bot@example.com"
          git config --global user.name "wannq"
          export LOCALVERSION="${{ inputs.localversion || '-next-palaziks' }}"
          chmod +x ./build.sh
          ./build.sh all ${{ inputs.device_name || 'star' }} 2>&1 | tee /tmp/kbuild.log

          if [ ! -f arch/arm64/boot/Image ]; then
            echo "BUILD FAILED"
            grep -E "error:|FAILED" /tmp/kbuild.log | tail -50
            exit 1
          fi

      - name: Compress & Upload
        run: |
          mkdir -p upload
          cp arch/arm64/boot/Image upload/ || true
          find ../out -name "*.zip" -exec cp {} upload/ \; || true
          tar -czvf kernel-star-ksunext.tar.gz upload/

      - uses: actions/upload-artifact@v4
        with:
          name: KernelSU-Next-SuSFS-${{ inputs.device_name }}
          path: kernel-star-ksunext.tar.gz
