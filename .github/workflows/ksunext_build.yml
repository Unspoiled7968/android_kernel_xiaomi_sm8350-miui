name: Build KernelSU + SuSFS Kernel

on:
  workflow_dispatch:
    inputs:
      device_name:
        description: 'Select the target device'
        required: true
        default: 'star'
        type: choice
        options:
          - star
          - mars
          - venus
      localversion:
        description: 'Custom text to append to kernel version (uname)'
        required: true
        default: '-palaziks'
        type: string
      swap_size:
        description: 'Swap file size in GB'
        required: true
        default: '16'
        type: string

  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Dynamic Memory Allocation (Swap)
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: ${{ github.event.inputs.swap_size || '16' }}

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y clang lld llvm git make gcc flex bison bc \
            libssl-dev ccache libncurses5-dev libncursesw5-dev cmake \
            python3 python-is-python3 cpio curl patch zip unzip tar

      - name: Integrate KernelSU v0.9.5
        run: |
          set -e
          echo "=== Cloning KernelSU v0.9.5 ==="
          git clone --depth=1 --branch v0.9.5 https://github.com/tiann/KernelSU.git KernelSU
          
          echo "=== Symlink KernelSU into drivers ==="
          # Use relative symlink to avoid path issues in different environments
          ln -sf ../KernelSU/kernel drivers/kernelsu

          echo "=== Wire into Makefile and Kconfig ==="
          grep -q "kernelsu" drivers/Makefile || echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          grep -q "kernelsu" drivers/Kconfig || sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

          echo "=== Disable kprobes in KernelSU source ==="
          find KernelSU/kernel -name "*.c" -o -name "*.h" | xargs sed -i 's/#ifdef CONFIG_KPROBES/#if 0/g'

      - name: Apply KSU Manual Hooks
        run: |
          python3 << 'EOF'
          import os, sys

          def insert_after(filepath, search, insertion):
              if not os.path.exists(filepath):
                  print(f"Skipping {filepath}: File not found")
                  return
              with open(filepath, 'r') as f:
                  content = f.read()
              if 'ksu_handle' in content:
                  print(f'{filepath}: hook already present')
                  return
              if search not in content:
                  print(f'ERROR: anchor not found in {filepath}')
                  # Non-blocking error for optional files, but crucial for core ones
                  return 
              content = content.replace(search, search + insertion, 1)
              with open(filepath, 'w') as f:
                  f.write(content)
              print(f'{filepath}: hook applied')

          # Fix fs/exec.c - Using a simpler search string to avoid whitespace issues
          insert_after('fs/exec.c', 'int flags)\n{', 
              '\n#ifdef CONFIG_KSU\n\textern bool ksu_execveat_hook __read_mostly;\n\textern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);\n\textern int ksu_handle_execveat_sucompat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);\n\tif (unlikely(ksu_execveat_hook))\n\t\tksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);\n\telse\n\t\tksu_handle_execveat_sucompat(&fd, &filename, &argv, &envp, &flags);\n#endif\n')

          # fs/open.c
          insert_after('fs/open.c', 'struct cred *override_cred;', 
              '\n#ifdef CONFIG_KSU\n\textern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags);\n\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n#endif\n')

          # fs/read_write.c
          insert_after('fs/read_write.c', 'ssize_t ret;', 
              '\n#ifdef CONFIG_KSU\n\textern int ksu_handle_vfs_read(struct file **file_ptr, char __user **buf_ptr, size_t *count_ptr, loff_t **pos);\n\tksu_handle_vfs_read(&file, &buf, &count, &pos);\n#endif\n')
          EOF

      - name: Integrate SuSFS
        run: |
          set -e
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b kernel-5.4 ../susfs4ksu
          SUSFS_DIR="$(pwd)/../susfs4ksu"

          # Apply patches
          cd KernelSU/kernel/
          patch -p1 < "$SUSFS_DIR/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch" || true
          cd ../../

          patch -p1 < "$SUSFS_DIR/kernel_patches/50_add_susfs_in_kernel-5.4.patch" || echo "Kernel patch partially failed, check logs"

          # Copy files
          cp "$SUSFS_DIR/kernel_patches/fs/susfs.c" fs/
          cp "$SUSFS_DIR/kernel_patches/include/linux/susfs.h" include/linux/
          cp "$SUSFS_DIR/kernel_patches/include/linux/susfs_def.h" include/linux/
          grep -q "susfs.o" fs/Makefile || echo "obj-y += susfs.o" >> fs/Makefile

      - name: MIUI 5.4 QGKI Fixes
        run: |
          # SusFS structural fixes for MIUI
          sed -i '/int mnt_flags;/a \ \ \ \ u64 susfs_mnt_id_backup;' include/linux/mount.h || true
          sed -i '1s/^/struct kstat;\n/' include/linux/susfs.h
          sed -i '1i #include <linux/susfs.h>' fs/proc/task_mmu.c
          sed -i '1i #include <linux/susfs.h>' fs/proc/fd.c
          # KernelSU TWA compatibility
          sed -i 's/TWA_RESUME/true/g' KernelSU/kernel/allowlist.c || true

      - name: Build Kernel
        run: |
          export LOCALVERSION="${{ github.event.inputs.localversion || '-palaziks' }}"
          DEVICE="${{ github.event.inputs.device_name || 'star' }}"
          
          # Find defconfig dynamically
          DEFCONFIG=$(find arch/arm64/configs -name "*${DEVICE}*defconfig" | head -n 1)
          
          # Force SuSFS/KSU configs
          {
            echo "CONFIG_KSU=y"
            echo "CONFIG_KSU_SUSFS=y"
            echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y"
            echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y"
            echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y"
            echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y"
            echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y"
          } >> "$DEFCONFIG"

          chmod +x ./build.sh
          ./build.sh all "$DEVICE"

      - name: Check and Pack
        run: |
          # Adjusted to find the zip regardless of naming convention in AnyKernel3 folder
          ZIP_PATH=$(find . -name "*.zip" | grep -i "AnyKernel" | head -n 1)
          if [ -f "$ZIP_PATH" ]; then
            mv "$ZIP_PATH" kernel-build.zip
          else
            echo "ZIP not found, checking arch/arm64/boot/Image"
            [ -f arch/arm64/boot/Image ] && zip -j kernel-build.zip arch/arm64/boot/Image || exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-${{ github.event.inputs.device_name }}-${{ github.run_id }}
          path: kernel-build.zip
