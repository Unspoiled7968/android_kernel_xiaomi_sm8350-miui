name: Show KSU Makefile

on:
  workflow_dispatch:
    inputs:
      ksu_variant:
        description: 'KSU variant'
        required: true
        default: 'KernelSU'
        type: choice
        options: [KernelSU, KernelSU-Next, WildKSU]

jobs:
  show:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup KSU and dump Makefile
        run: |
          if [ "${{ inputs.ksu_variant }}" = "KernelSU" ]; then
            curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
          elif [ "${{ inputs.ksu_variant }}" = "KernelSU-Next" ]; then
            curl -LSs "https://raw.githubusercontent.com/sidex15/KernelSU-Next/legacy-susfs-v2/kernel/setup.sh" | bash -s legacy-susfs-v2
          elif [ "${{ inputs.ksu_variant }}" = "WildKSU" ]; then
            curl -LSs "https://raw.githubusercontent.com/WildKernels/Wild_KSU/wild/kernel/setup.sh" | bash -s wild
          fi

          KSU_REAL=$(realpath drivers/kernelsu)
          KSU_MK="$KSU_REAL/Makefile"

          echo "====== drivers/kernelsu/ contents ======"
          ls -la "$KSU_REAL/"

          echo "====== Full KSU Makefile ======"
          cat "$KSU_MK"

          echo "====== obj variables ======"
          grep -E "^[a-z_-]+[-_][ym]" "$KSU_MK" | head -20

          echo "====== sucompat.c ksu_handle presence ======"
          grep -c "ksu_handle" "$KSU_REAL/sucompat.c" 2>/dev/null || echo "sucompat.c not found"
          grep "^ksu_handle\|^int ksu_handle\|^static.*ksu_handle" "$KSU_REAL/sucompat.c" 2>/dev/null | head -10 || true
