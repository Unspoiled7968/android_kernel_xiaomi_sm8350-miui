name: Show vfs_read signature

on:
  workflow_dispatch:

jobs:
  show:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Dump vfs_read signature
        run: |
          echo "====== fs/read_write.c: vfs_read function ======"
          grep -n "vfs_read" fs/read_write.c | head -20
          echo ""
          echo "====== exact lines around vfs_read definition ======"
          grep -n "^ssize_t vfs_read\|^EXPORT_SYMBOL\|^{" fs/read_write.c | head -20
          echo ""
          echo "====== 10 lines starting from vfs_read ======"
          grep -n "ssize_t vfs_read" fs/read_write.c | head -5 | while read line; do
            lineno=$(echo "$line" | cut -d: -f1)
            sed -n "${lineno},$((lineno+8))p" fs/read_write.c
            echo "---"
          done

          echo "====== fs/exec.c: pathbuf anchor ======"
          grep -n "pathbuf" fs/exec.c | head -10

          echo "====== fs/open.c: faccessat anchor ======"
          grep -n "old_cred\|override_cred\|faccessat" fs/open.c | head -15
