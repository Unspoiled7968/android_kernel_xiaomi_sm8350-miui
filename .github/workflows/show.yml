name: Show Hook Locations

on:
  workflow_dispatch:

jobs:
  show:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show hook context
        run: |
          echo "=== exec.c 1744-1790 ==="
          sed -n '1744,1790p' fs/exec.c

          echo "=== open.c do_faccessat body ==="
          grep -n "do_faccessat" fs/open.c | head -3
          sed -n '348,375p' fs/open.c

          echo "=== read_write.c vfs_read body ==="
          sed -n '446,475p' fs/read_write.c

          echo "=== stat.c vfs_statx body ==="
          sed -n '168,200p' fs/stat.c
