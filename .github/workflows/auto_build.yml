name: Auto build (hyper-17)

# Builds the 'bisect' branch source with BPF disabled, to isolate the LTS-merge
# regression. Auto-runs on every push to 'bisect' (so regenerated candidates
# build themselves), and can be run manually.

on:
  push:
    branches:
      - hyper-17
  workflow_dispatch:
    inputs:
      device_name:
        description: 'Select the target device'
        required: true
        default: 'star'
        type: choice
        options:
          - star
          - mars
          - venus
      localversion:
        description: 'Custom text to append to kernel version (uname)'
        required: true
        default: '-palaziks'
        type: string
      swap_size:
        description: 'Swap file size in GB'
        required: true
        default: '16'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout bisect source
        uses: actions/checkout@v4

      - name: Dynamic Memory Allocation (Swap)
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: ${{ github.event.inputs.swap_size || '16' }}

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y clang lld llvm git make gcc flex bison bc \
            libssl-dev ccache libncurses5-dev libncursesw5-dev cmake \
            python3 python-is-python3 cpio

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: 3G
          key: kernel-hyper17-auto

      - name: Create clang ccache wrappers
        run: |
          mkdir -p "$HOME/.ccache_wrappers"
          printf '#!/bin/sh\nexec ccache /usr/bin/clang "$@"\n' \
            > "$HOME/.ccache_wrappers/clang"
          printf '#!/bin/sh\nexec ccache /usr/bin/clang++ "$@"\n' \
            > "$HOME/.ccache_wrappers/clang++"
          chmod +x "$HOME/.ccache_wrappers/clang" \
                   "$HOME/.ccache_wrappers/clang++"
          echo "$HOME/.ccache_wrappers" >> "$GITHUB_PATH"

      - name: Build Project
        run: |
          git config --global user.email "you@example.com"
          git config --global user.name "bisect-bot"
          export LOCALVERSION="${{ github.event.inputs.localversion || '-palaziks' }}"
          echo "clang -> $(which clang)"
          echo "=== SUBLEVEL under test ==="
          grep -E "^SUBLEVEL" Makefile
          ccache --zero-stats > /dev/null 2>&1 || true
          chmod +x ./build.sh
          ./build.sh all ${{ github.event.inputs.device_name || 'star' }}

      - name: Compress
        run: tar -czvf build.tar.gz ../out/anykernel/*.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-palaziks
          path: build.tar.gz
