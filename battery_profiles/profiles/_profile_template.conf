# Battery profile template for star battery compatibility layer

PROFILE_ID="star_template"
PROFILE_NAME="Template"
TARGET_DEVICE="star"
BOARD_SOURCE="xiaomi_11u_original_fg_board"
CELL_SOURCE="unknown"
CELL_CHEMISTRY="unknown"
PROFILE_STAGE="candidate"

# Keep disabled until values are verified by charge/discharge logs.
CAPACITY_COMPAT_ENABLE=0

# Design capacity is the intended nominal pack capacity in uAh.
CAPACITY_COMPAT_DESIGN_UAH=0

# Full capacity is the Android-facing usable-full target in uAh.
# Set this from real logs, not only from the printed cell label.
CAPACITY_COMPAT_FULL_UAH=0

# Voltage floor used by the low-end reserve model.
CAPACITY_COMPAT_EMPTY_UV=3150000

# Extra reserve window used only in the low-end tail.
CAPACITY_COMPAT_RESERVE_PCT=2

NOTES="Fill this profile from real charging and near-empty discharge logs."
